<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UA Reporting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Layout: thanh chọn ngày ở trên, mỗi nhóm khách hàng là một lưới thẻ app (giống TTAM report theo app) */
  :root {
    --bg: #f4f5f8;
    --card: #ffffff;
    --border: #e6e7ec;
    --text: #15171c;
    --muted: #8a8f99;
    --chip-bg: #f1f2f5;
    --chip-border: #e2e4e9;
    --chip-text: #4a4f59;
    --camp-bg: #f1f1fb;
    --camp-text: #4338ca;
    --good: #9a5b1e;      /* >= 90% KPI */
    --bad: #a32d2d;       /* < 90% KPI */
    --up: #2e7d32;
    --down: #b3261e;
    --line: #4f46e5;
    --on-line: #ffffff;
    --track: #eef0f3;
    --warn-bg: #fff6e5;
    --warn-text: #7a4b00;
    --spend: #0e7490;
    --new-bg: #fff4c2; --new-bd: #f2d36b; --new-fg: #7a5600;
    --shadow: 0 1px 2px rgba(16, 24, 40, .04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115; --card: #181b21; --border: #262a33; --text: #eceef2; --muted: #8c93a0;
      --chip-bg: #22262e; --chip-border: #2e333d; --chip-text: #c3c8d1;
      --camp-bg: #23233d; --camp-text: #a5a3ff;
      --good: #d4914a; --bad: #e0675f; --up: #5fbf68; --down: #ef6b62;
      --line: #8b85ff; --on-line: #0f1115; --track: #262a33;
      --warn-bg: #2e2412; --warn-text: #f3c77a; --spend: #4fb8cf;
      --new-bg: #3a3112; --new-bd: #7a6420; --new-fg: #f5d77a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1115; --card: #181b21; --border: #262a33; --text: #eceef2; --muted: #8c93a0;
    --chip-bg: #22262e; --chip-border: #2e333d; --chip-text: #c3c8d1;
    --camp-bg: #23233d; --camp-text: #a5a3ff;
    --good: #d4914a; --bad: #e0675f; --up: #5fbf68; --down: #ef6b62;
    --line: #8b85ff; --on-line: #0f1115; --track: #262a33;
    --warn-bg: #2e2412; --warn-text: #f3c77a; --spend: #4fb8cf;
      --new-bg: #3a3112; --new-bd: #7a6420; --new-fg: #f5d77a;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-feature-settings: "tnum";
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1680px; margin: 0 auto; padding: 16px; }

  /* ---------- Toolbar ---------- */
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 18px; }
  .seg { display: inline-flex; flex-wrap: wrap; background: var(--card); border: 1px solid var(--border); border-radius: 11px; padding: 3px; gap: 2px; }
  .seg button {
    font: inherit; font-size: 14px; font-weight: 500; color: var(--chip-text);
    background: transparent; border: 0; border-radius: 8px; padding: 6px 11px; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--line); color: var(--on-line); }
  .custom { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; color: var(--muted); }
  .custom input { font: inherit; font-size: 14px; color: var(--text); background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px; }
  .range-label { font-size: 14px; color: var(--muted); }
  .spacer { flex: 1; }
  .tb {
    font: inherit; font-size: 14px; font-weight: 500; color: var(--text);
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 7px 12px; cursor: pointer;
  }
  .tb:hover { background: var(--chip-bg); }
  .tb.primary { background: var(--line); border-color: var(--line); color: var(--on-line); }
  .tb.danger { color: var(--down); }
  .tb:disabled { opacity: .5; cursor: default; }

  .banner { background: var(--warn-bg); color: var(--warn-text); border-radius: 12px; padding: 12px 14px; font-size: 14px; line-height: 1.5; margin-bottom: 18px; }

  /* ---------- Groups ---------- */
  section + section { margin-top: 40px; }
  .group-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin: 4px 0 20px; }
  .group-head h1 { font-size: 28px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
  .group-head .sub { color: var(--muted); font-size: 20px; }
  .group-head .actions { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .status { font-size: 13px; color: var(--muted); }
  .acc-errors { display: grid; gap: 6px; margin: -8px 0 16px; }
  .acc-errors div { font-size: 13px; color: var(--down); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr));
    gap: 24px;
    align-items: start;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 24px 24px 20px;
    box-shadow: var(--shadow);
    display: flex; flex-direction: column;
    min-width: 0;
  }
  .card.loading { min-height: 300px; justify-content: center; align-items: center; color: var(--muted); }
  .top { display: flex; justify-content: space-between; gap: 12px; }
  .top > div:first-child { min-width: 0; }
  .name-row { display: flex; align-items: baseline; gap: 6px; }
  .card .name { margin: 4px 0 2px; }
  .name-empty { font: inherit; font-size: 24px; font-weight: 600; color: var(--muted); background: none; border: 0; padding: 0; cursor: pointer; border-bottom: 2px dashed var(--border); }
  .name-empty:hover { color: var(--camp-text); border-color: var(--camp-text); }
  body.readonly .readonly-only.name { display: block; }
  .app-code { font-size: 15px; font-weight: 600; color: var(--muted); letter-spacing: .04em; }
  .pic { font-size: 14px; color: var(--muted); margin-top: 6px; }
  .pic b { color: var(--text); font-weight: 600; }
  .pic-empty { font: inherit; color: var(--camp-text); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .readonly-only { display: none; }
  body.readonly .readonly-only { display: inline; }
  .name { font-size: 24px; font-weight: 600; margin: 4px 0 12px; }
  .score { text-align: right; flex-shrink: 0; }
  .score .val { font-size: 44px; font-weight: 700; line-height: 1; letter-spacing: -.02em; }
  .score .pct { color: var(--muted); font-size: 18px; margin-top: 8px; }

  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip {
    font-size: 17px; font-weight: 500;
    padding: 5px 11px; border-radius: 7px;
    background: var(--chip-bg); border: 1px solid var(--chip-border); color: var(--chip-text);
    max-width: 100%; overflow-wrap: anywhere;
  }
  .chip.camp { background: var(--camp-bg); color: var(--camp-text); border-color: transparent; }

  .bar { height: 8px; border-radius: 99px; background: var(--track); margin: 22px 0 16px; overflow: hidden; }
  .bar > span { display: block; height: 100%; border-radius: 99px; }

  .spark { width: 100%; height: 64px; display: block; overflow: visible; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 24px; }
  .stat .lbl { font-size: 16px; font-weight: 500; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
  .stat .num { font-size: 23px; font-weight: 600; margin-top: 8px; letter-spacing: .01em; }
  .num.up { color: var(--up); } .num.down { color: var(--down); } .num.na { color: var(--muted); }

  .foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 18px; }
  .acc { color: var(--muted); font-size: 18px; letter-spacing: .03em; overflow: hidden; text-overflow: ellipsis; }
  .btn {
    font: inherit; font-size: 19px; color: var(--text);
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 8px 15px; cursor: pointer; flex-shrink: 0;
  }
  .btn:hover, .btn[aria-expanded="true"] { background: var(--chip-bg); }
  .icon {
    font: inherit; font-size: 13px; color: var(--muted); background: transparent;
    border: 1px solid transparent; border-radius: 8px; padding: 4px 8px; cursor: pointer;
  }
  .icon:hover { color: var(--text); border-color: var(--border); background: var(--card); }

  .daily { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 10px; overflow-x: auto; }
  .daily table { width: 100%; border-collapse: collapse; font-size: 15px; }
  .daily th { text-align: right; color: var(--muted); font-weight: 500; padding: 4px 6px; white-space: nowrap; }
  .daily td { text-align: right; padding: 4px 6px; border-top: 1px solid var(--border); }
  .daily th:first-child, .daily td:first-child { text-align: left; }

  .empty {
    border: 1.5px dashed var(--border); border-radius: 18px; min-height: 160px; width: 100%;
    display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px;
    color: var(--muted); font-size: 16px; cursor: pointer; background: transparent; font-family: inherit;
  }
  .empty:hover { color: var(--text); border-color: var(--muted); }
  div.empty { cursor: default; }

  /* ---------- Dialogs ---------- */
  dialog {
    border: 1px solid var(--border); border-radius: 16px; padding: 0;
    background: var(--card); color: var(--text); width: min(560px, calc(100vw - 32px));
  }
  dialog::backdrop { background: rgba(10, 12, 16, .45); }
  dialog form { padding: 20px; }
  dialog h2 { margin: 0 0 16px; font-size: 19px; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .fields .full { grid-column: 1 / -1; }
  .fields label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--muted); font-weight: 500; }
  .fields input, .fields textarea {
    font: inherit; font-size: 15px; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; width: 100%;
  }
  .fields textarea { min-height: 96px; resize: vertical; font-variant-numeric: tabular-nums; }
  .fields .hint { font-weight: 400; font-size: 12px; }
  .dlg-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
  .dlg-actions .spacer { flex: 1; }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    background: var(--text); color: var(--card); padding: 10px 16px; border-radius: 10px;
    font-size: 14px; max-width: calc(100vw - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.18);
  }
  body.readonly .edit-only { display: none !important; }
  .tb:focus-visible, .btn:focus-visible, .icon:focus-visible, .empty:focus-visible, .seg button:focus-visible { outline: 2px solid var(--line); outline-offset: 2px; }

  @media (max-width: 520px) {
    .card { padding: 18px 16px 16px; }
    .name { font-size: 20px; }
    .score .val { font-size: 36px; }
    .stat .lbl { font-size: 13px; }
    .stat .num { font-size: 19px; }
    .acc { font-size: 14px; }
    .btn { font-size: 16px; }
    .fields { grid-template-columns: 1fr; }
    .group-head .actions { margin-left: 0; }
  }

  /* ---------- v3: date range, KPI inline, campaign panel, top geo ---------- */
  .daterange { display: inline-flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--card); border: 1px solid var(--border); border-radius: 11px; padding: 5px 10px; }
  .daterange label { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; color: var(--muted); }
  .daterange input { font: inherit; font-size: 14px; color: var(--text); background: transparent; border: 0; padding: 2px 0; }
  .chip.kpi { display: inline-flex; align-items: center; gap: 6px; }
  .chip.kpi input {
    font: inherit; font-size: 17px; font-weight: 600; color: var(--text); width: 4.2em;
    background: var(--card); border: 1px solid var(--chip-border); border-radius: 5px; padding: 0 4px;
  }
  body.readonly .chip.kpi input { border-color: transparent; background: transparent; pointer-events: none; }
  .vs { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .acc-link {
    font: inherit; color: var(--muted); font-size: 18px; letter-spacing: .03em; background: none; border: 0; padding: 0;
    cursor: pointer; text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 4px;
    overflow-wrap: anywhere; min-width: 0; text-align: left;
  }
  .acc-link:hover { color: var(--text); text-decoration-color: currentColor; }
  .foot-btns { display: flex; gap: 8px; flex-shrink: 0; }
  .panel { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 10px; overflow-x: auto; }
  .panel table { width: 100%; border-collapse: collapse; font-size: 15px; }
  .panel th { text-align: right; color: var(--muted); font-weight: 500; padding: 4px 6px; white-space: nowrap; }
  .panel td { text-align: right; padding: 4px 6px; border-top: 1px solid var(--border); }
  .panel th:first-child, .panel td:first-child { text-align: left; }
  .panel .note { color: var(--muted); font-size: 14px; padding: 6px 0; }
  .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 14px; color: var(--muted); }
  .share { color: var(--muted); font-size: 13px; }

  dialog.wide { width: min(1080px, calc(100vw - 32px)); }
  .camp-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; margin-bottom: 12px; }
  .camp-head h2 { margin: 0; }
  .camp-head .meta { color: var(--muted); font-size: 14px; }
  .camp-tools { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 10px; font-size: 14px; color: var(--muted); }
  .camp-tools input[type="search"] { font: inherit; font-size: 14px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; min-width: 0; flex: 1 1 200px; }
  .camp-table { max-height: 62vh; overflow: auto; border: 1px solid var(--border); border-radius: 10px; }
  .camp-table table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .camp-table th { position: sticky; top: 0; background: var(--card); text-align: right; color: var(--muted); font-weight: 500; padding: 8px 10px; white-space: nowrap; border-bottom: 1px solid var(--border); }
  .camp-table td { text-align: right; padding: 7px 10px; border-top: 1px solid var(--border); white-space: nowrap; }
  .camp-table th:first-child, .camp-table td:first-child { text-align: left; white-space: normal; overflow-wrap: anywhere; min-width: 260px; }
  .camp-table tfoot td { font-weight: 600; border-top: 2px solid var(--border); }
  .pill { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--chip-bg); color: var(--chip-text); }
  .sort { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); background: var(--card); border: 1px solid var(--border); border-radius: 9px; padding: 2px 2px 2px 8px; }
  .sort button { font: inherit; font-size: 13px; font-weight: 500; color: var(--chip-text); background: none; border: 0; border-radius: 7px; padding: 4px 8px; cursor: pointer; }
  .sort button[aria-pressed="true"] { background: var(--line); color: var(--on-line); }
  .th-sort { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .th-sort[aria-pressed="true"] { color: var(--text); font-weight: 600; }
  .pill.new { background: var(--new-bg); color: var(--new-fg); }
  .pill.max { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
  .stat-link { font: inherit; font-size: 23px; font-weight: 600; margin-top: 8px; color: var(--text); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 5px; }
  .stat-link.na { color: var(--muted); }
  .pill.on { background: color-mix(in srgb, var(--up) 15%, transparent); color: var(--up); }
  .foot { flex-wrap: wrap; }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .tabs button {
    font: inherit; font-size: 16px; font-weight: 600; color: var(--muted); background: none; border: 0;
    border-bottom: 2px solid transparent; padding: 10px 14px; margin-bottom: -1px; cursor: pointer;
  }
  .tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--line); }
  .tabs button:hover { color: var(--text); }
  .tabs .tab-add { font-weight: 500; font-size: 14px; color: var(--camp-text); }
  .filter-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
  .save-state { font-size: 13px; color: var(--muted); }
  .save-state.saved { color: var(--up); }
  .save-state.error { color: var(--down); font-weight: 600; }
  .acc-wrap { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .acc-date { font-size: 13px; color: var(--muted); }
  .new-row { display: flex; justify-content: flex-end; margin-top: 12px; }
  .new-badge { font: inherit; cursor: pointer; border: 1px solid var(--new-bd); background: var(--new-bg); color: var(--new-fg); border-radius: 12px; padding: 8px 16px; display: flex; flex-direction: column; align-items: center; min-width: 110px; line-height: 1.1; }
  .new-badge b { font-size: 32px; font-weight: 700; }
  .new-badge span { font-size: 13px; font-weight: 500; margin-top: 4px; white-space: nowrap; }
  .new-badge.zero { background: transparent; border-color: var(--border); color: var(--muted); }
  .groupby { border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; display: grid; gap: 6px; }
  .groupby legend { font-size: 13px; color: var(--muted); font-weight: 500; padding: 0 4px; }
  .groupby label { flex-direction: row !important; align-items: center; gap: 8px !important; color: var(--text) !important; font-size: 14px !important; }
  .match-err { margin-top: 8px; font-size: 13px; color: var(--down); background: color-mix(in srgb, var(--down) 8%, transparent); border-radius: 8px; padding: 6px 10px; }
  .f-code, .f-kw { font: inherit; font-size: 15px; font-weight: 500; min-width: 0; border: 1px dashed transparent; outline: none; }
  .f-code { flex: 1 1 120px; } .f-kw { flex: 1 1 100px; }
  .f-code::placeholder, .f-kw::placeholder { color: var(--camp-text); opacity: .55; }
  .f-code:hover, .f-code:focus, .f-kw:hover, .f-kw:focus { border-color: var(--camp-text); }
  .f-code.custom, .f-kw.custom { border-style: solid; border-color: color-mix(in srgb, var(--camp-text) 40%, transparent); }
  .plus { color: var(--muted); font-weight: 600; }
  body.readonly .f-code, body.readonly .f-kw { pointer-events: none; }
  .trend { margin-top: 20px; display: grid; gap: 4px; }
  .trend-lbl { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); margin-top: 6px; }
  .trend-lbl b { font-weight: 600; }
  .trend .spark { height: 52px; }
  .key { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
  .trend-axis { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .chip.camp { font-size: 15px; }
  @media (max-width: 520px) { .acc-link { font-size: 14px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="toolbar">
    <div class="seg" id="presetSeg" role="group" aria-label="Chọn nhanh khoảng ngày">
      <button data-preset="today">Hôm nay</button>
      <button data-preset="yesterday">Hôm qua</button>
      <button data-preset="3d">3 ngày qua</button>
      <button data-preset="7d">7 ngày qua</button>
    </div>
    <div class="daterange">
      <label>Từ <input type="date" id="dStart"></label>
      <label>Đến <input type="date" id="dEnd"></label>
    </div>
    <span class="range-label" id="rangeLabel"></span>
    <span class="spacer"></span>
    <span class="save-state" id="saveState" role="status"></span>
    <button class="tb edit-only" data-act="save" id="saveBtn">Lưu</button>
    <button class="tb" data-act="refresh" id="refreshBtn">Làm mới</button>
  </div>
  <div id="banner" class="banner" hidden></div>
  <div id="app"></div>
</div>

<dialog id="groupDlg">
  <form method="dialog">
    <h2>Nhóm tài khoản</h2>
    <div class="fields">
      <label class="full">Tên nhóm<input name="name" id="g-name" required placeholder="Apero"></label>
      <label class="full">Lọc camp có chữ<input name="keyword" id="g-keyword" required value="Ecomdy"></label>
      <fieldset class="full groupby"><legend>Gom thẻ theo</legend>
        <label><input type="radio" name="groupBy" value="app" checked> Mã app <span class="hint">— 1 tài khoản chạy nhiều app, mỗi mã app 1 thẻ</span></label>
        <label><input type="radio" name="groupBy" value="account"> Tài khoản <span class="hint">— 1 tài khoản 1 app, mỗi tài khoản 1 thẻ</span></label>
      </fieldset>
      <label class="full">ID tài khoản quảng cáo <span class="hint">(mỗi dòng 1 ID)</span>

<script>
/* ============================================================
   Cấu hình (người dùng nhập):
     groups: [{ name, keyword, accounts: ["7542..."] }]
     apps:   { "<MÃ APP>": { name, kpi, os } }     // KPI riêng từng app
   Số liệu kéo từ TikTok qua connector "TikTok MCP" (ngày theo múi giờ của tài khoản):
     advertiser_info_get    → tên + múi giờ tài khoản
     report_integrated_get  → spend, ad_impression_ad_revenue_roas_day0 (ROAS IAA D0); theo quốc gia cho Top geo
     campaign_get           → trạng thái + ngân sách/ngày của camp
   Camp được gom theo mã app = đoạn đầu tiên của tên camp khác từ khóa lọc
   (APB508_Global_ROAS_Ecomdy_... → APB508, Ecomdy_Elyra_... → Elyra).
   ============================================================ */
const SERVER = "TikTok MCP";
const CONFIG_DOC = "dashboard/config";
const LOCAL_KEY = "ecomdy-kpi-config-v2";
const M_IAA = "ad_impression_ad_revenue_roas_day0";
const MAX_RATIO = 0.98;   // spend ≥ 98% budget ngày → tính là max budget

let config = { groups: [], apps: {}, hidden: [] };
let results = [];                 // theo chỉ số nhóm: { status, apps, errors }
const accInfo = new Map();        // acc → { name, tz }
const accData = new Map();        // acc → { campaigns: [...] }  (của lần tải gần nhất)
const geoCache = new Map();       // `${acc}|${code}|${start}|${end}` → { status, rows, error }
const openPanels = new Map();     // cardId → "daily" | "geo"
let dbRef = null, mcp = null, mcpReady = false, readOnly = false;
let writing = Promise.resolve();
let loadGen = 0;
let range = null;                 // { start, end } — mặc định hôm nay theo giờ tài khoản
let rangeTouched = false;
const TAB_KEY = "ecomdy-kpi-tab";
let activeTab = (() => { try { return +localStorage.getItem(TAB_KEY) || 0; } catch (e) { return 0; } })();
const SORT_KEY = "ecomdy-kpi-sort";
let appSort = (() => { try { return localStorage.getItem(SORT_KEY) === "roas" ? "roas" : "spend"; } catch (e) { return "spend"; } })();
let campSort = "spend";
const roasOf = x => x.spend > 0 ? x.rev / x.spend : -1;
const bySort = key => (x, y) => key === "roas" ? roasOf(y) - roasOf(x) || y.spend - x.spend : y.spend - x.spend || roasOf(y) - roasOf(x);
function setTab(i) { activeTab = i; try { localStorage.setItem(TAB_KEY, String(i)); } catch (e) {} }

/* ---------- Helpers ---------- */
const isNum = v => typeof v === "number" && isFinite(v);
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const fmtUsd = v => !isNum(v) ? "—" : "$" + (v >= 1000 || Number.isInteger(v)
  ? Math.round(v).toLocaleString("en-US")
  : v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad2 = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const parseYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const dayDiff = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 86400000);
const shortDate = s => { const [, m, d] = s.split("-"); return `${d}/${m}`; };
const spanText = (a, b) => a === b ? shortDate(a) : `${shortDate(a)}–${shortDate(b)}`;
const appName = code => config.apps[code]?.name || (String(code).startsWith("acc:") ? accInfo.get(code.slice(4))?.name || "Cả tài khoản" : code);
const kpiOf = code => { const k = config.apps[code]?.kpi; return isNum(k) && k > 0 ? k : 1; };
const roasCls = (roas, kpi) => roas >= kpi ? "up" : "down";
let regionNames = null;
try { regionNames = new Intl.DisplayNames(["vi"], { type: "region" }); } catch (e) {}
const countryName = cc => { try { return regionNames?.of(cc) || cc; } catch (e) { return cc; } };

function dayInTz(utc, tz) {
  if (!utc) return "";
  const d = new Date(String(utc).replace(" ", "T") + "Z");
  if (isNaN(d)) return "";
  try { return new Intl.DateTimeFormat("en-CA", { timeZone: tz || "UTC", year: "numeric", month: "2-digit", day: "2-digit" }).format(d); }
  catch (e) { return String(utc).slice(0, 10); }
}
function todayIn(tz) {
  try {
    const parts = new Intl.DateTimeFormat("en-CA", { timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(new Date());
    const g = t => parts.find(p => p.type === t).value;
    return `${g("year")}-${g("month")}-${g("day")}`;
  } catch (e) { return ymd(new Date()); }
}
function tzOffset(tz) {
  try {
    return new Intl.DateTimeFormat("en-US", { timeZone: tz, timeZoneName: "shortOffset" }).formatToParts(new Date())
      .find(p => p.type === "timeZoneName").value.replace("GMT", "UTC");
  } catch (e) { return tz; }
}
function firstTz() {
  for (const g of config.groups) for (const a of g.accounts || []) { const tz = accInfo.get(a)?.tz; if (tz) return tz; }
  return null;
}

/* ---------- Khoảng ngày ---------- */
// Ngày theo múi giờ từng tài khoản: khoảng ngày có chứa "hôm nay" (giờ máy bạn) thì mỗi tài khoản
// dùng "hôm nay" của chính nó (vd. 6h sáng VN, tài khoản UTC+0 vẫn đang ở ngày hôm qua).
// Khoảng ngày trong quá khứ thì giữ nguyên ngày; TikTok tự tính theo múi giờ tài khoản.
// Chọn nhanh: tính theo "hôm nay" của từng tài khoản. "3/7 ngày qua" không gồm hôm nay (giống TikTok Ads Manager).
const PRESETS = { today: [0, 0], yesterday: [1, 1], "3d": [3, 1], "7d": [7, 1] };
function presetRange(key) {
  const t = new Date(), [a, b] = PRESETS[key];
  return { start: ymd(addDays(t, -a)), end: ymd(addDays(t, -b)), preset: key };
}
function accShift(acc) {
  const base = range || { start: ymd(new Date()), end: ymd(new Date()) };
  const tz = acc && accInfo.get(acc)?.tz;
  if (!tz || (!base.preset && base.end < ymd(new Date()))) return 0;
  return dayDiff(ymd(new Date()), todayIn(tz));
}
function rangeWindows(acc) {
  const base = range || { start: ymd(new Date()), end: ymd(new Date()) };
  const sh = accShift(acc);
  const cur = sh ? { start: ymd(addDays(parseYmd(base.start), sh)), end: ymd(addDays(parseYmd(base.end), sh)) } : base;
  const len = dayDiff(cur.start, cur.end) + 1;
  // Kỳ trước: cùng số ngày, ngay trước kỳ đang xem (hôm nay → hôm qua)
  const prev = { start: ymd(addDays(parseYmd(cur.start), -len)), end: ymd(addDays(parseYmd(cur.start), -1)) };
  // Biểu đồ + dữ liệu theo ngày: ít nhất 14 ngày, tối đa 30 (giới hạn report theo ngày).
  // Khi kỳ ≤ 15 ngày, cửa sổ này phủ cả kỳ đang xem lẫn kỳ trước → chỉ cần 1 lần gọi report.
  const trendLen = len <= 15 ? Math.max(14, len * 2) : Math.min(30, len);
  const trend = { start: ymd(addDays(parseYmd(cur.end), -(trendLen - 1))), end: cur.end };
  return { cur, prev, trend, len };
}
function ensureDefaultRange() {
  if (range?.preset) { range = presetRange(range.preset); return; }   // làm mới mốc khi qua ngày
  if (rangeTouched && range) return;
  range = presetRange("today");
}
function renderRangeUi() {
  const { cur, prev, len } = rangeWindows();
  document.querySelectorAll("#presetSeg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.preset === range?.preset));
  document.getElementById("dStart").value = cur.start;
  document.getElementById("dEnd").value = cur.end;
  const accs = config.groups[activeTab]?.accounts || [];
  const tzs = [...new Set(accs.map(a => accInfo.get(a)?.tz).filter(Boolean).map(tzOffset))];
  const shifted = accs.filter(a => accShift(a) !== 0);
  document.getElementById("rangeLabel").textContent =
    `${len} ngày · Δ so với ${spanText(prev.start, prev.end)}` + (tzs.length ? ` · theo giờ từng tài khoản (${tzs.join(", ")})` : "")
    + (shifted.length ? ` · ${shifted.length} tài khoản đang ở ngày ${spanText(rangeWindows(shifted[0]).cur.start, rangeWindows(shifted[0]).cur.end)}` : "");
}

/* ---------- Lưu cấu hình ---------- */
function loadLocal() {
  try { const raw = localStorage.getItem(LOCAL_KEY); if (raw) return normalize(JSON.parse(raw)); } catch (e) {}
  return { groups: [], apps: {} };
}
function normalize(c) {
  return { groups: Array.isArray(c?.groups) ? c.groups : [], apps: c?.apps && typeof c.apps === "object" ? c.apps : {},
    hidden: Array.isArray(c?.hidden) ? c.hidden : [] };
}
// App đã xóa khỏi dashboard: theo nhóm + tài khoản + mã app ("nhóm#tài khoản|mã")
const hideKey = (gi, acc, code) => `${config.groups[gi]?.name || gi}#${acc}|${code}`;
const isHidden = (gi, a) => (config.hidden || []).includes(hideKey(gi, a.acc, a.code));
// Trạng thái lưu: mọi thay đổi tự lưu ngay; nút Lưu để lưu lại thủ công và xác nhận.
let saveStatus = { state: "idle", at: null }, pendingSaves = 0;
function showSaveState() {
  const el = document.getElementById("saveState"); if (!el) return;
  const t = saveStatus.at ? new Date(saveStatus.at).toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" }) : "";
  el.className = "save-state " + saveStatus.state;
  el.textContent = saveStatus.state === "saving" ? "Đang lưu…"
    : saveStatus.state === "error" ? "Chưa lưu được, bấm Lưu để thử lại"
    : saveStatus.state === "saved" ? `Đã lưu lúc ${t}` : (dbRef ? "Tự lưu lên server" : "Lưu trong trình duyệt này");
}
function saveConfig(manual = false) {
  const snap = structuredClone(config);
  if (!dbRef) {
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(snap)); saveStatus = { state: "saved", at: Date.now() }; if (manual) toast("Đã lưu."); }
    catch (e) { saveStatus = { state: "error", at: null }; toast("Trình duyệt không cho lưu cấu hình."); }
    showSaveState();
    return Promise.resolve();
  }
  pendingSaves++; saveStatus = { ...saveStatus, state: "saving" }; showSaveState();
  writing = writing.then(() => dbRef.set({ ...snap, updatedAt: new Date().toISOString() }))
    .then(() => { if (!--pendingSaves) { saveStatus = { state: "saved", at: Date.now() }; showSaveState(); if (manual) toast("Đã lưu lên server."); } })
    .catch(err => {
      pendingSaves = Math.max(0, pendingSaves - 1);
      saveStatus = { state: "error", at: null }; showSaveState();
      if (err?.code === "invalid_argument") { readOnly = true; render(); toast("Bạn chỉ có quyền xem, thay đổi không được lưu."); }
      else toast("Chưa lưu được thay đổi. Kiểm tra kết nối rồi bấm Lưu.");
    });
  return writing;
}
window.addEventListener("beforeunload", e => {
  if (pendingSaves > 0 || saveStatus.state === "error") { e.preventDefault(); e.returnValue = ""; }
});

/* ---------- Gọi TikTok qua connector ---------- */
const ERR_TEXT = {
  server_not_connected: `Chưa kết nối connector ${SERVER}. Thêm trong claude.ai → Settings → Connectors rồi bấm Làm mới.`,
  needs_reauth: `Kết nối ${SERVER} đã hết hạn. Kết nối lại trong claude.ai → Settings → Connectors.`,
  selection_required: `Bạn có nhiều connector ${SERVER}. Chọn một connector khi được hỏi rồi bấm Làm mới.`,
  not_in_manifest: `Trang chưa được phép dùng ${SERVER}. Bấm Làm mới và chọn Cho phép.`,
  consent_required: `Trang chưa được phép dùng ${SERVER}. Bấm Làm mới và chọn Cho phép.`,
  blocked_by_policy: `Tổ chức của bạn đang chặn ${SERVER} cho trang này.`,
  approval_required: `Tổ chức yêu cầu duyệt từng lần gọi ${SERVER}, trang này chưa hỗ trợ.`,
  server_unavailable: "TikTok không phản hồi. Đợi một lát rồi bấm Làm mới.",
  tt_rate_limited: "TikTok đang giới hạn số lần gọi (rate limit). Đợi 1–2 phút rồi bấm Làm mới.",
  rate_limited: "Trang gọi TikTok quá nhanh. Đợi 1 phút rồi bấm Làm mới.",
};
const PAGE_LEVEL = new Set(["server_not_connected", "needs_reauth", "selection_required", "not_in_manifest", "consent_required", "blocked_by_policy", "approval_required"]);
const errText = e => ERR_TEXT[e?.code] || e?.message || "Không kéo được số liệu.";

// Hàng đợi: TikTok giới hạn số request/giây, nên gọi lần lượt từng request, cách nhau ≥ 350 ms.
const Q = { active: 0, next: 0, waiters: [] };
const Q_MAX = 1, Q_GAP = 350;
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function acquireSlot() {
  while (Q.active >= Q_MAX) await new Promise(r => Q.waiters.push(r));
  Q.active++;
  const now = Date.now(), at = Math.max(now, Q.next);
  Q.next = at + Q_GAP;
  if (at > now) await sleep(at - now);
}
function releaseSlot() { Q.active--; const w = Q.waiters.shift(); if (w) w(); }
const RATE_RE = /rate.?limit|too many|too frequent|frequently|qps|exceed/i;
const RATE_CODES = new Set([40100, 40133, 50002]);

async function tt(tool, input, refresh) {
  // Khoảng ngày có hôm nay: số còn chạy → chỉ dùng lại trong 1 phút; ngày cũ: 5 phút
  const live = (range?.end || "") >= ymd(addDays(new Date(), -1));
  const opts = { cache: { staleTime: live ? 60000 : 300000, gcTime: 3600000, refresh: !!refresh } };
  for (let attempt = 0; ; attempt++) {
    const backoff = () => sleep(Math.min(16000, 2000 * 2 ** attempt) + Math.random() * 1000);
    await acquireSlot();
    let res, err;
    try { res = await mcp.callTool(SERVER, tool, input, opts); } catch (e) { err = e; } finally { releaseSlot(); }
    if (err) {
      const limited = err.code === "rate_limited" || (err.code === "tool_error" && RATE_RE.test(err.message || ""));
      if (limited && attempt < 3) { await (err.retryAfterMs ? sleep(Math.min(err.retryAfterMs, 30000)) : backoff()); continue; }
      if (limited) throw { code: "tt_rate_limited", message: err.message };
      if (err.retryable && attempt < 1) { await sleep(Math.min(err.retryAfterMs || 0, 10000) + 800 + Math.random() * 1200); continue; }
      throw err;
    }
    let p = res?.payload;
    if (typeof p === "string") { try { p = JSON.parse(p); } catch (e) {} }
    if (!p || typeof p !== "object") throw { code: "bad_payload", message: "TikTok trả về dữ liệu không đọc được." };
    if (p.code !== undefined && Number(p.code) !== 0) {
      const limited = RATE_CODES.has(Number(p.code)) || RATE_RE.test(p.message || "");
      if (limited && attempt < 3) { refresh = true; await backoff(); continue; }
      if (limited) throw { code: "tt_rate_limited", message: p.message };
      throw { code: "api_error", message: `TikTok: ${p.message || "lỗi " + p.code}` };
    }
    return { data: p.data || {}, storedAt: res.cache?.storedAt };
  }
}
// Report xếp spend giảm dần: gặp dòng spend = 0 thì các trang sau toàn 0 → dừng (đỡ request, đỡ rate limit)
async function allPages(tool, input, refresh) {
  const stopAtZero = input.order_field === "spend";
  const rows = [], seen = new Set(); let storedAt;
  for (let page = 1; page <= 20; page++) {
    const { data, storedAt: s } = await tt(tool, { ...input, page, page_size: 1000 }, refresh);
    if (s && (!storedAt || s < storedAt)) storedAt = s;
    for (const row of data.list || []) {
      const k = JSON.stringify(row.dimensions || row.campaign_id || row);
      if (!seen.has(k)) { seen.add(k); rows.push(row); }
    }
    if (page >= (data.page_info?.total_page || 1)) break;
    const last = (data.list || []).at(-1);
    if (stopAtZero && last && num(last.metrics?.spend) === 0) break;
  }
  return { rows, storedAt };
}

async function loadAccInfo(refresh) {
  const ids = [...new Set(config.groups.flatMap(g => g.accounts || []))].filter(id => refresh || !accInfo.has(id));
  for (let i = 0; i < ids.length; i += 50) {
    try {
      const { data } = await tt("advertiser_info_get", { advertiser_ids: ids.slice(i, i + 50), fields: ["advertiser_id", "name", "timezone", "display_timezone"] }, refresh);
      for (const a of data.list || []) accInfo.set(String(a.advertiser_id), { name: a.name, tz: a.timezone || a.display_timezone });
    } catch (e) { /* tên + múi giờ là phụ; lỗi quyền sẽ hiện ở bước kéo report */ }
  }
}

function appCode(name, kw) {
  const segs = name.trim().split("_").map(s => s.trim()).filter(Boolean);
  return segs.find(s => s.toLowerCase() !== kw.toLowerCase()) || segs[0] || "?";
}
function commonPrefix(names, kw) {
  let p = null;
  for (const n of names) {
    const segs = n.trim().split("_");
    if (!p) { p = segs; continue; }
    let i = 0; while (i < p.length && i < segs.length && p[i] === segs[i]) i++;
    p = p.slice(0, i);
  }
  p = p || [];
  // Cắt sau đoạn chứa từ khóa: APB508_Global_ROAS_Ecomdy_0110_... → APB508_Global_ROAS_Ecomdy
  const k = p.findIndex(s => s.toLowerCase() === kw.toLowerCase());
  if (k >= 0 && k < p.length - 1) p = p.slice(0, Math.max(k + 1, 2));
  return p.join("_");
}

// Kéo dữ liệu thô của 1 tài khoản. Việc gom theo app làm riêng (aggregate) để đổi bộ lọc camp không phải kéo lại.
async function fetchAccount(acc, kw, win, refresh) {
  const filtering = [{ field_name: "campaign_name", filter_type: "MATCH", filter_value: kw }];
  const base = { advertiser_id: acc, report_type: "BASIC", data_level: "AUCTION_CAMPAIGN", filtering };
  // Số chính (spend, ROAS, Δ) lấy từ report TỔNG theo camp — giống TTAM, ít dòng (thường 1 trang) nên không
  // sót dòng khi số đang chạy. Report theo ngày (nhiều trang) chỉ dùng cho biểu đồ / bảng theo ngày / max budget.
  const [cur, prev, trend, camps] = await Promise.all([
    allPages("report_integrated_get", { ...base, dimensions: ["campaign_id"], metrics: ["campaign_name", "spend", M_IAA], start_date: win.cur.start, end_date: win.cur.end, order_field: "spend" }, refresh),
    allPages("report_integrated_get", { ...base, dimensions: ["campaign_id"], metrics: ["campaign_name", "spend"], start_date: win.prev.start, end_date: win.prev.end, order_field: "spend" }, refresh),
    allPages("report_integrated_get", { ...base, dimensions: ["campaign_id", "stat_time_day"], metrics: ["campaign_name", "spend", M_IAA], start_date: win.trend.start, end_date: win.trend.end, order_field: "spend" }, refresh),
    allPages("campaign_get", { advertiser_id: acc, filtering: { campaign_name: kw }, fields: ["campaign_id", "campaign_name", "budget", "budget_mode", "operation_status", "roas_bid", "create_time"] }, refresh)
      .catch(() => ({ rows: [] })), // ngân sách là phụ: lỗi thì hiện spend TB/ngày
  ]);
  return {
    cur: cur.rows, prev: prev.rows,
    trend: trend.rows, camps: camps.rows, storedAt: cur.storedAt, curRange: { ...win.cur },
  };
}

// Bộ lọc camp của từng app = các chữ người dùng gõ (cách nhau bằng dấu phẩy) + mã app.
// Camp phải chứa TẤT CẢ các điều kiện mới thuộc app (không phân biệt hoa thường).
// Vd. lọc "Ecomdy" + mã app "APB508" → camp có cả "Ecomdy" và "APB508".
// Nhiều app cùng khớp → app có điều kiện cụ thể hơn (dài hơn) thắng.
const splitTerms = f => (f || "").split(/[,;+]/).map(t => t.trim().toLowerCase()).filter(Boolean);
const onlyKeyword = (t, kw) => !t.split(kw.toLowerCase()).join("").replace(/[_\s-]/g, "");
// Lọc camp của app theo mã app người dùng nhập (camp đã được lọc từ khóa nhóm, vd. Ecomdy, từ lúc kéo report).
function ruleTerms(code, kw) {
  const c = config.apps[code]?.appCode?.trim().toLowerCase();
  return c && !onlyKeyword(c, kw) ? [c] : null;   // trống → tự gom theo mã tách từ tên camp
}
function assigner(kw) {
  const rules = Object.keys(config.apps)
    .map(code => ({ code, terms: ruleTerms(code, kw) }))
    .filter(x => x.terms)
    .sort((a, b) => b.terms.join("").length - a.terms.join("").length);
  const ruled = new Set(rules.map(x => x.code));
  return name => {
    const n = name.toLowerCase();
    for (const x of rules) if (x.terms.every(t => n.includes(t))) return x.code;
    const code = appCode(name, kw);
    return ruled.has(code) ? null : code;
  };
}

// mode "account": cả tài khoản là 1 app (khóa "acc:<id>"); mã app nhập vào (nếu có) chỉ để lọc thêm.
function aggregate(acc, raw, kw, mode = "app") {
  const kwl = kw.toLowerCase();
  const accKey = `acc:${acc}`;
  const accTerms = mode === "account" ? ruleTerms(accKey, kw) : null;
  const assign = mode === "account"
    ? (name => !accTerms || accTerms.every(t => name.toLowerCase().includes(t)) ? accKey : null)
    : assigner(kw);
  const apps = new Map();
  const campaigns = new Map();  // id → { id, name, code, spend, rev, status, budget, budgetMode }
  const get = code => {
    if (!apps.has(code)) apps.set(code, { acc, code, names: new Set(), ids: new Set(), spend: 0, rev: 0, prevSpend: 0, maxed: 0, newCamps: 0, days: new Map() });
    return apps.get(code);
  };
  const ok = name => typeof name === "string" && name.toLowerCase().includes(kwl);
  const camp = (id, name) => {
    if (!campaigns.has(id)) campaigns.set(id, { id, name, code: assign(name), spend: 0, rev: 0, status: null, budget: null, budgetMode: null });
    return campaigns.get(id);
  };

  for (const r of raw.cur) {
    const m = r.metrics || {}; if (!ok(m.campaign_name)) continue;
    const id = String(r.dimensions?.campaign_id || ""); const sp = num(m.spend); const rev = sp * num(m[M_IAA]);
    if (id) { const c = camp(id, m.campaign_name); c.spend += sp; c.rev += rev; }
    const code = assign(m.campaign_name); if (!code) continue;
    const a = get(code);
    a.names.add(m.campaign_name); a.spend += sp; a.rev += rev;
    if (sp > 0 && id) a.ids.add(id);
  }
  for (const r of raw.prev) {
    const m = r.metrics || {}; if (!ok(m.campaign_name)) continue;
    const code = assign(m.campaign_name); if (code) get(code).prevSpend += num(m.spend);
  }
  const campDays = new Map();   // id → Map(ngày → spend), chỉ các ngày trong kỳ đang xem
  const cr = raw.curRange || {};
  for (const r of raw.trend) {
    const m = r.metrics || {}; if (!ok(m.campaign_name)) continue;
    const day = String(r.dimensions?.stat_time_day || "").slice(0, 10); if (!day) continue;
    if (day >= cr.start && day <= cr.end) {
      const id = String(r.dimensions?.campaign_id || "");
      if (!campDays.has(id)) campDays.set(id, new Map());
      const cd = campDays.get(id); cd.set(day, (cd.get(day) || 0) + num(m.spend));
    }
    const code = assign(m.campaign_name); if (!code) continue;
    const a = get(code); const sp = num(m.spend);
    const d = a.days.get(day) || { spend: 0, rev: 0 };
    d.spend += sp; d.rev += sp * num(m[M_IAA]);
    a.days.set(day, d);
  }
  for (const c of raw.camps) {
    if (!ok(c.campaign_name)) continue;
    const row = camp(String(c.campaign_id), c.campaign_name);
    row.status = c.operation_status; row.budget = num(c.budget); row.budgetMode = c.budget_mode;
    row.roasBid = num(c.roas_bid) || null;
    // Camp mới: tạo trong khoảng ngày đang xem (create_time là UTC → đổi sang giờ tài khoản)
    row.createdDay = dayInTz(c.create_time, accInfo.get(acc)?.tz);
    row.isNew = !!row.createdDay && row.createdDay >= cr.start && row.createdDay <= cr.end;
    if (row.code && row.isNew) get(row.code).newCamps++;
    // Max budget: có ngày spend ≥ 98% budget ngày (so với budget đang đặt hiện tại)
    const daily = /DAY|DAILY/.test(c.budget_mode || "") && row.budget > 0;
    const cd = campDays.get(row.id);
    row.daysSpent = cd ? [...cd.values()].filter(v => v > 0).length : 0;
    row.maxDays = daily && cd ? [...cd.values()].filter(v => v >= row.budget * MAX_RATIO).length : 0;
    if (!row.code || !row.maxDays) continue;
    const a = apps.get(row.code); if (a) a.maxed++;
  }
  accData.set(acc, { campaigns: [...campaigns.values()], kw });
  // App đã nhập mã nhưng mã không khớp camp nào trong tài khoản → vẫn hiện thẻ, kèm báo lỗi
  const allNames = [...new Set([...raw.cur, ...raw.trend].map(r => r.metrics?.campaign_name)
    .concat(raw.camps.map(c => c.campaign_name)).filter(ok))].map(n => n.toLowerCase());
  const autoHere = new Set(allNames.map(n => appCode(n, kw).toLowerCase()));
  for (const code of (mode === "account" ? [accKey] : Object.keys(config.apps))) {
    const t = ruleTerms(code, kw); if (!t) continue;
    if (mode === "account") { if (!allNames.some(n => t.every(x => n.includes(x)))) get(code).noMatch = t.join(" + "); continue; }
    if (!apps.has(code) && !autoHere.has(code.toLowerCase())) continue;   // app không thuộc tài khoản này
    if (!allNames.some(n => t.every(x => n.includes(x)))) get(code).noMatch = t.join(" + ");
  }
  const list = [...apps.values()].filter(a => a.spend > 0 || a.noMatch || a.newCamps > 0);
  for (const a of list) a.prefix = commonPrefix([...a.names], kw) || a.code;
  return list;
}

const accRaw = new Map();   // `${acc}|${kw}` → dữ liệu thô của lần kéo gần nhất
function rebuild(gi) {
  const g = config.groups[gi], r = results[gi];
  if (!g || !r || r.status !== "ok") return;
  const kw = (g.keyword || "Ecomdy").trim();
  r.apps = r.accs.flatMap(acc => { const raw = accRaw.get(`${acc}|${kw}`); return raw ? aggregate(acc, raw, kw, g.groupBy) : []; });
  r.apps.sort((a, b) => b.spend - a.spend);
}

// silent = tự cập nhật ngầm: giữ số cũ trên màn hình đến khi có số mới, lỗi thì giữ số cũ.
async function loadAll(refresh = false, silent = false) {
  if (silent && document.getElementById("refreshBtn").disabled) return;   // đang kéo dở thì thôi
  const gen = ++loadGen;
  if (!mcpReady) { ensureDefaultRange(); renderRangeUi(); render(); return; }
  if (!mcp) {
    ensureDefaultRange(); renderRangeUi();
    showBanner(`Kéo số tự động chỉ chạy khi mở trang này trên Claude, với connector ${SERVER} đã kết nối.`);
    render(); return;
  }
  hideBanner();
  const gi = activeTab, g = config.groups[gi];
  if (!g) { render(); return; }
  const prevRes = results[gi];
  silent = silent && prevRes?.status === "ok";
  if (!silent) { results[gi] = { status: "loading", apps: [], errors: [] }; render(); }
  document.getElementById("refreshBtn").disabled = true;
  if (silent) { prevRes.updating = true; render(); }
  try {
    await loadAccInfo(refresh);
    if (gen !== loadGen) return;
    ensureDefaultRange(); renderRangeUi();
    if (refresh) geoCache.clear();
    const win = rangeWindows();   // khoảng ngày chung (khóa cache); mỗi tài khoản dùng rangeWindows(acc)
    const kw = (g.keyword || "Ecomdy").trim();
    const accounts = g.accounts || [];
    // Kéo lần lượt từng tài khoản trong nhóm; xong tài khoản nào hiện tài khoản đó
    const res = { status: "ok", apps: [], errors: [], accs: [], storedAt: null, rangeKey: `${win.cur.start}|${win.cur.end}`, progress: `0/${accounts.length}` };
    if (!silent) results[gi] = res;
    for (let i = 0; i < accounts.length; i++) {
      res.progress = `${i + 1}/${accounts.length}`;
      if (i) { rebuild(gi); render(); }   // khi chạy ngầm: thẻ của tài khoản vừa kéo xong đổi số ngay
      try {
        const raw = await fetchAccount(accounts[i], kw, rangeWindows(accounts[i]), refresh);
        if (gen !== loadGen) return;
        accRaw.set(`${accounts[i]}|${kw}`, raw); res.accs.push(accounts[i]);
        if (raw.storedAt && (!res.storedAt || raw.storedAt < res.storedAt)) res.storedAt = raw.storedAt;
      } catch (e) {
        if (gen !== loadGen) return;
        if (silent && accRaw.has(`${accounts[i]}|${kw}`)) { res.accs.push(accounts[i]); res.staleAccs = (res.staleAccs || 0) + 1; continue; }
        res.errors.push({ acc: accounts[i], err: e });
        // Lỗi kết nối connector thì các tài khoản sau cũng lỗi y vậy → dừng sớm, khỏi gọi thêm
        if (PAGE_LEVEL.has(e?.code) || e?.code === "tt_rate_limited") {
          for (const rest of accounts.slice(i + 1)) res.errors.push({ acc: rest, err: e });
          break;
        }
      }
    }
    delete res.progress;
    res.loadedAt = Date.now();
    if (!res.storedAt) res.storedAt = res.loadedAt;
    // Mọi tài khoản cùng lỗi kết nối (vd. chưa kết nối connector) → báo một lần ở đầu trang
    const errs = res.errors.map(e => e.err);
    if (errs.length && errs.length === accounts.length && errs.every(e => e?.code === errs[0]?.code) && PAGE_LEVEL.has(errs[0]?.code)) {
      showBanner(errText(errs[0])); res.errors = []; res.pageError = true;
    }
    results[gi] = res;
    rebuild(gi);
    render();
  } finally {
    if (prevRes) prevRes.updating = false;
    if (gen === loadGen) document.getElementById("refreshBtn").disabled = false;
  }
}

// Tự cập nhật khi khoảng ngày có hôm nay (số còn chạy): 3 phút/lần, chỉ khi tab đang mở
const AUTO_MS = 180000;
const isLive = () => (range?.end || "") >= ymd(addDays(new Date(), -1));
function autoRefresh() {
  if (document.hidden || !isLive()) return;
  const r = results[activeTab];
  if (!r || r.status !== "ok" || r.progress || Date.now() - (r.loadedAt || 0) < AUTO_MS - 5000) return;
  loadAll(true, true);
}
setInterval(autoRefresh, 30000);
document.addEventListener("visibilitychange", autoRefresh);

/* ---------- Top geo ---------- */
async function loadGeo(a) {
  const { cur } = rangeWindows(a.acc);
  const key = `${a.acc}|${a.code}|${cur.start}|${cur.end}`;
  if (geoCache.get(key)?.status === "ok" || geoCache.get(key)?.status === "loading") return;
  geoCache.set(key, { status: "loading" }); render();
  try {
    const ids = [...a.ids]; const byCc = new Map();
    for (let i = 0; i < ids.length; i += 100) {
      const { rows } = await allPages("report_integrated_get", {
        advertiser_id: a.acc, report_type: "AUDIENCE", data_level: "AUCTION_CAMPAIGN",
        dimensions: ["country_code"], metrics: ["spend", M_IAA],
        start_date: cur.start, end_date: cur.end, order_field: "spend",
        filtering: [{ field_name: "campaign_ids", filter_type: "IN", filter_value: JSON.stringify(ids.slice(i, i + 100)) }],
      });
      for (const r of rows) {
        const cc = r.dimensions?.country_code || "?"; const sp = num(r.metrics?.spend);
        if (!sp) continue;
        const g = byCc.get(cc) || { cc, spend: 0, rev: 0 };
        g.spend += sp; g.rev += sp * num(r.metrics?.[M_IAA]); byCc.set(cc, g);
      }
    }
    geoCache.set(key, { status: "ok", rows: [...byCc.values()].sort((x, y) => y.spend - x.spend) });
  } catch (e) { geoCache.set(key, { status: "error", error: e }); }
  render();
}

function geoPanel(a, kpi) {
  const { cur } = rangeWindows(a.acc);
  const g = geoCache.get(`${a.acc}|${a.code}|${cur.start}|${cur.end}`);
  if (!g || g.status === "loading") return `<div class="note">Đang kéo top geo…</div>`;
  if (g.status === "error") return `<div class="note">${esc(errText(g.error))}</div>`;
  if (!g.rows.length) return `<div class="note">Không có spend theo quốc gia trong khoảng ngày này.</div>`;
  const total = g.rows.reduce((s, r) => s + r.spend, 0);
  const top = g.rows.slice(0, 10);
  const rest = g.rows.slice(10);
  const line = r => `<tr><td>${esc(countryName(r.cc))} <span class="share">${esc(r.cc)}</span></td><td>${fmtUsd(r.spend)}</td><td class="share">${Math.round(r.spend / total * 100)}%</td><td class="num ${roasCls(r.rev / r.spend, kpi)}">${(r.rev / r.spend).toFixed(3)}</td></tr>`;
  const restRow = rest.length ? (() => { const s = rest.reduce((x, r) => x + r.spend, 0), v = rest.reduce((x, r) => x + r.rev, 0);
    return `<tr><td>${rest.length} nước khác</td><td>${fmtUsd(s)}</td><td class="share">${Math.round(s / total * 100)}%</td><td class="num ${roasCls(v / s, kpi)}">${(v / s).toFixed(3)}</td></tr>`; })() : "";
  return `<div class="panel-head"><span>Top geo · ${spanText(cur.start, cur.end)}</span><button class="icon" data-act="geo-csv" data-acc="${esc(a.acc)}" data-code="${esc(a.code)}">Xuất CSV</button></div>
    <table><thead><tr><th>Quốc gia</th><th>Spend</th><th>%</th><th>ROAS IAA D0</th></tr></thead><tbody>${top.map(line).join("")}${restRow}</tbody></table>`;
}

/* ---------- Render ---------- */
function trendDays(acc) {
  const { trend } = rangeWindows(acc); const out = [];
  for (let d = parseYmd(trend.start); ymd(d) <= trend.end; d = addDays(d, 1)) out.push(ymd(d));
  return out;
}

// Hai đường theo ngày: Spend (trên) và ROAS IAA D0 (dưới, nét đứt = KPI)
function trendCharts(a, days, kpi) {
  const W = 480, H = 52, pad = 5;
  const spend = days.map(d => a.days.get(d)?.spend || 0);
  const roas = days.map(d => { const x = a.days.get(d); return x && x.spend > 0 ? x.rev / x.spend : null; });
  const x = i => days.length > 1 ? (i / (days.length - 1)) * W : W / 2;
  const tips = days.map((d, i) => {
    const w = W / days.length;
    return `<rect x="${(x(i) - w / 2).toFixed(1)}" y="0" width="${w.toFixed(1)}" height="${H}" fill="transparent"><title>${shortDate(d)} · Spend ${fmtUsd(spend[i])} · ROAS ${roas[i] == null ? "—" : roas[i].toFixed(3)}</title></rect>`;
  }).join("");

  // Spend: 0 → max
  const sMax = Math.max(...spend, 0) || 1;
  const sy = v => pad + (1 - v / sMax) * (H - pad * 2);
  const sPts = spend.map((v, i) => `${x(i).toFixed(1)},${sy(v).toFixed(1)}`);
  const sArea = `M${x(0).toFixed(1)},${H - pad} L${sPts.join(" L")} L${x(days.length - 1).toFixed(1)},${H - pad} Z`;
  const spendSvg = `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${sArea}" fill="var(--spend)" opacity=".12"/>
    <polyline points="${sPts.join(" ")}" fill="none" stroke="var(--spend)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    ${tips}</svg>`;

  // ROAS: khoảng giá trị bao cả KPI
  const vals = roas.filter(isNum);
  let roasSvg = `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"></svg>`;
  if (vals.length) {
    const lo = Math.min(...vals, kpi), hi = Math.max(...vals, kpi), span = hi - lo || 1;
    const ry = v => pad + (1 - (v - lo) / span) * (H - pad * 2);
    const idx = roas.map((v, i) => isNum(v) ? i : -1).filter(i => i >= 0);
    const ky = ry(kpi).toFixed(1);
    const dots = idx.slice(-2).map(i => `<circle cx="${x(i)}" cy="${ry(roas[i])}" r="4" fill="${roas[i] >= kpi ? "var(--up)" : "var(--down)"}"/>`).join("");
    roasSvg = `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
      <line x1="0" x2="${W}" y1="${ky}" y2="${ky}" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="6 5" vector-effect="non-scaling-stroke" opacity=".7"/>
      <polyline points="${idx.map(i => `${x(i).toFixed(1)},${ry(roas[i]).toFixed(1)}`).join(" ")}" fill="none" stroke="var(--line)" stroke-width="2.2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
      ${dots}${tips}</svg>`;
  }
  const lastR = [...roas].reverse().find(isNum);
  return `<div class="trend">
    <div class="trend-lbl"><span><i class="key" style="background:var(--spend)"></i>Spend theo ngày</span><span>cao nhất ${fmtUsd(Math.max(...spend, 0))}</span></div>
    ${spendSvg}
    <div class="trend-lbl"><span><i class="key" style="background:var(--line)"></i>ROAS IAA D0</span><span>KPI ${kpi.toFixed(2)} (nét đứt)${isNum(lastR) ? ` · gần nhất <b class="num ${roasCls(lastR, kpi)}">${lastR.toFixed(3)}</b>` : ""}</span></div>
    ${roasSvg}
    <div class="trend-axis"><span>${shortDate(days[0])}</span><span>${shortDate(days[days.length - 1])}</span></div>
  </div>`;
}

function dailyPanel(a, kpi, days) {
  const rows = days.slice().reverse().map(day => {
    const d = a.days.get(day);
    if (!d || !d.spend) return `<tr><td>${shortDate(day)}</td><td>—</td><td class="num na">—</td></tr>`;
    const r = d.rev / d.spend;
    return `<tr><td>${shortDate(day)}</td><td>${fmtUsd(d.spend)}</td><td class="num ${roasCls(r, kpi)}">${r.toFixed(3)}</td></tr>`;
  }).join("");
  return `<table><thead><tr><th>Ngày</th><th>Spend</th><th>ROAS IAA D0</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function card(a) {
  const win = rangeWindows(a.acc), days = trendDays(a.acc);
  const ov = config.apps[a.code] || {};
  const kpi = kpiOf(a.code);
  const score = a.spend > 0 ? a.rev / a.spend : null;
  const ratio = isNum(score) ? score / kpi : 0;
  const color = isNum(score) && score >= kpi ? "var(--up)" : "var(--down)";
  const hasDelta = a.prevSpend > 0;
  const delta = hasDelta ? (a.spend - a.prevSpend) / a.prevSpend : 0;
  const id = `${a.acc}-${a.code}`;
  const panel = openPanels.get(id);
  const accName = accInfo.get(a.acc)?.name;
  const kwG = (config.groups[activeTab]?.keyword || "Ecomdy").trim();
  const customF = !!ruleTerms(a.code, kwG);
  const byAcc = a.code.startsWith("acc:");
  const shownName = ov.name || (byAcc ? accName : "");

  return `<article class="card">
    <div class="top">
      <div>
        <div class="name-row">${shownName ? `<div class="name">${esc(shownName)}</div>` : `<button class="name name-empty edit-only" data-act="edit-app" data-code="${esc(a.code)}" data-acc="${esc(a.acc)}">Đặt tên app</button><div class="name readonly-only">${esc(ov.appCode || a.code)}</div>`}<button class="icon edit-only" data-act="edit-app" data-code="${esc(a.code)}" data-acc="${esc(a.acc)}">Sửa</button></div>
        <div class="pic">UA PIC: ${ov.pic ? `<b>${esc(ov.pic)}</b>` : `<button class="pic-empty edit-only" data-act="edit-app" data-code="${esc(a.code)}" data-acc="${esc(a.acc)}">điền tên</button><span class="readonly-only">—</span>`}</div>
      </div>
      <div class="score">
        <div class="val" style="color:${isNum(score) ? color : "var(--muted)"}">${isNum(score) ? score.toFixed(3) : "—"}</div>
        <div class="pct">KPI ${kpi.toFixed(2)}</div>
      </div>
    </div>
    <div class="filter-row" title="Chỉ tính camp có tên chứa mã app (không phân biệt hoa thường). Để trống = tự gom theo mã tách từ tên camp.">
      <input class="chip camp f-code${ov.appCode?.trim() ? " custom" : ""}" data-code="${esc(a.code)}" value="${esc(ov.appCode || "")}" placeholder="${esc(byAcc ? "Lọc theo mã app (không bắt buộc)" : a.code)}" spellcheck="false" aria-label="Mã app" ${readOnly ? "readonly" : ""}>
      <span class="share">${a.names.size} camp${customF ? "" : byAcc ? " · cả tài khoản" : " · tự gom"}</span>
    </div>
    ${a.noMatch ? `<div class="match-err" role="alert">Không có camp ${esc(kwG)} nào chứa "${esc(ov.appCode)}" trong tài khoản này. Kiểm tra lại mã app.</div>` : ""}

    ${trendCharts(a, days, kpi)}

    <div class="stats">
      <div class="stat"><div class="lbl">Spend</div><div class="num">${fmtUsd(a.spend)}</div></div>
      <div class="stat"><div class="lbl">Δ Spend</div>${hasDelta
        ? `<div class="num ${delta >= 0 ? "up" : "down"}">${(delta >= 0 ? "+" : "-") + Math.abs(Math.round(delta * 100))}%</div>`
        : `<div class="num na">—</div>`}<div class="vs">so với ${spanText(win.prev.start, win.prev.end)} (${fmtUsd(a.prevSpend)})</div></div>
      <div class="stat" title="Số camp có ít nhất 1 ngày spend ≥ 98% budget ngày (budget đang đặt) trong khoảng đang xem. Bấm để xem danh sách.">
        <div class="lbl">Max budget</div>
        <button class="num stat-link${a.maxed ? "" : " na"}" data-act="camps" data-acc="${esc(a.acc)}" data-code="${esc(a.code)}" data-maxed="1">${a.maxed} camp</button>
        <div class="vs">/ ${a.ids.size} camp có spend</div></div>
    </div>

    <div class="foot">
      <span class="acc-wrap"><button class="acc-link" data-act="camps" data-acc="${esc(a.acc)}" data-code="${esc(a.code)}" title="${esc(accName || "Xem camp")}">${esc(a.acc)}</button>
        <span class="acc-date">${spanText(win.cur.start, win.cur.end)}${accInfo.get(a.acc)?.tz ? " · " + tzOffset(accInfo.get(a.acc).tz) : ""}</span></span>
      <span class="foot-btns">
        <button class="btn" data-act="panel" data-kind="geo" data-id="${esc(id)}" aria-expanded="${panel === "geo"}">Top geo</button>
        <button class="btn" data-act="panel" data-kind="daily" data-id="${esc(id)}" aria-expanded="${panel === "daily"}">Theo ngày</button>
      </span>
    </div>
    <div class="new-row"><button class="new-badge${a.newCamps ? "" : " zero"}" data-act="camps" data-acc="${esc(a.acc)}" data-code="${esc(a.code)}" data-new="1"
      title="Camp ${esc(config.groups[activeTab]?.keyword || "Ecomdy")} được tạo trong khoảng ngày đang xem (theo giờ tài khoản). Bấm để xem.">
      <b>${a.newCamps}</b><span>camp mới ${win.cur.start === win.cur.end ? (win.cur.end === todayIn(accInfo.get(a.acc)?.tz) ? "hôm nay" : shortDate(win.cur.end)) : spanText(win.cur.start, win.cur.end)}</span></button></div>
    ${panel === "daily" ? `<div class="panel">${dailyPanel(a, kpi, days)}</div>` : ""}
    ${panel === "geo" ? `<div class="panel">${geoPanel(a, kpi)}</div>` : ""}
  </article>`;
}

function render() {
  document.body.classList.toggle("readonly", readOnly);
  const el = document.getElementById("app");
  if (!config.groups.length) {
    el.innerHTML = readOnly
      ? `<div class="empty">Chưa có nhóm tài khoản nào.</div>`
      : `<button class="empty" data-act="add-group">Bấm để thêm nhóm đầu tiên: đặt tên (vd. Apero) và dán ID tài khoản quảng cáo. Trang sẽ tự kéo các camp Ecomdy về.</button>`;
    return;
  }
  if (activeTab >= config.groups.length) activeTab = 0;

  const gi = activeTab, g = config.groups[gi];
  const r0 = results[gi] || { status: "idle", apps: [], errors: [] };
  const hiddenN = r0.apps.filter(a => isHidden(gi, a)).length;
  const r = { ...r0, apps: r0.apps.filter(a => !isHidden(gi, a)) };
  const total = r.apps.reduce((s, a) => s + a.spend, 0);
  const kw = esc(g.keyword || "Ecomdy");
  const sub = r.status === "ok"
    ? `${r.apps.length} app · ${fmtUsd(Math.round(total))} · chỉ camp ${kw}${hiddenN ? ` · <button class="icon unhide edit-only" data-act="unhide" data-g="${esc(g.name)}">Hiện lại ${hiddenN} app đã xóa</button>` : ""}`
    : `${(g.accounts || []).length} tài khoản · chỉ camp ${kw}`;
  const status = r.status === "loading" ? "Đang kéo số…"
    : r.progress ? `Đang kéo tài khoản ${r.progress}…`
    : r.updating ? "Đang cập nhật…"
    : r.status === "ok" && r.storedAt ? `Số liệu lúc ${new Date(r.storedAt).toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" })}${isLive() ? " · tự cập nhật 3 phút/lần" : ""}${r.staleAccs ? ` · ${r.staleAccs} tài khoản chưa cập nhật được` : ""}`
    : "";
  let body;
  if (r.status === "loading" || (r.progress && !r.apps.length)) body = `<div class="card loading">Đang kéo số từ TikTok…</div>`;
  else if (r.pageError || r.status !== "ok") body = `<div class="empty">Chưa có số liệu.</div>`;
  else if (!r.apps.length && !r.errors.length) body = `<div class="empty">${hiddenN ? "Đã xóa hết app khỏi dashboard. Bấm \"Hiện lại\" ở trên để lấy lại." : `Không có camp ${kw} nào có spend trong khoảng ngày này.`}</div>`;
  else body = [...r.apps].sort(bySort(appSort)).map(a => card(a)).join("") + (r.progress ? `<div class="card loading">Đang kéo tài khoản ${r.progress}…</div>` : "");
  const errs = r.errors.length ? `<div class="acc-errors">${r.errors.map(e => `<div>Tài khoản ${esc(e.acc)}: ${esc(errText(e.err))}</div>`).join("")}</div>` : "";
  const tabs = `<nav class="tabs" role="tablist" aria-label="Nhóm tài khoản">${config.groups.map((x, i) =>
      `<button role="tab" data-act="tab" data-g="${i}" aria-selected="${i === gi}">${esc(x.name)}</button>`).join("")}
    <button class="tab-add edit-only" data-act="add-group" title="Thêm nhóm">+ Nhóm</button></nav>`;
  el.innerHTML = `${tabs}<section role="tabpanel">
      <div class="group-head">
        <h1>${esc(g.name)}</h1>
        <span class="sub">${sub}</span>
        <span class="actions"><span class="status">${status}</span>
          <span class="sort" role="group" aria-label="Sắp xếp app">Sắp xếp
            <button data-act="sort" data-key="spend" aria-pressed="${appSort === "spend"}">Spend ↓</button>
            <button data-act="sort" data-key="roas" aria-pressed="${appSort === "roas"}">ROAS ↓</button></span>
          <button class="icon edit-only" data-act="edit-group" data-g="${gi}">Sửa nhóm</button></span>
      </div>
      ${errs}
      <div class="grid">${body}</div>
    </section>`;
}

/* ---------- Bảng camp của tài khoản ---------- */
const campDlg = document.getElementById("campDlg");
let campView = null; // { acc, code }

function campRows() {
  const d = accData.get(campView.acc); if (!d) return [];
  const q = document.getElementById("campSearch").value.trim().toLowerCase();
  const onlyApp = document.getElementById("campOnlyApp").checked;
  const hideZero = document.getElementById("campHideZero").checked;
  const onlyMaxed = document.getElementById("campOnlyMaxed").checked;
  const onlyNew = document.getElementById("campOnlyNew").checked;
  return d.campaigns
    .filter(c => (!onlyApp || c.code === campView.code) && (!hideZero || c.spend > 0) && (!onlyMaxed || c.maxDays > 0) && (!onlyNew || c.isNew) && (!q || c.name.toLowerCase().includes(q)))
    .sort((x, y) => bySort(campSort)(x, y) || x.name.localeCompare(y.name));
}
function renderCamps() {
  const rows = campRows();
  const box = document.getElementById("campTable");
  if (!rows.length) { box.innerHTML = `<div class="panel"><div class="note" style="padding:12px">Không có camp nào khớp bộ lọc.</div></div>`; return; }
  const sp = rows.reduce((s, c) => s + c.spend, 0), rv = rows.reduce((s, c) => s + c.rev, 0);
  const status = s => s === "ENABLE" ? `<span class="pill on">Đang chạy</span>` : s ? `<span class="pill">Tắt</span>` : `<span class="pill">—</span>`;
  const { len } = rangeWindows(campView.acc);
  const maxCell = c => !c.budget || !/DAY|DAILY/.test(c.budgetMode || "") ? `<span class="share">—</span>`
    : c.maxDays ? `<span class="pill max">${len === 1 ? "Max" : `${c.maxDays}/${c.daysSpent || len} ngày`}</span>` : `<span class="share">chưa</span>`;
  const maxed = rows.filter(c => c.maxDays > 0).length;
  box.innerHTML = `<table><thead><tr><th>Camp</th><th>App</th><th>Trạng thái</th><th>Budget/ngày</th><th>Max budget</th><th><button class="th-sort" data-act="camp-sort" data-key="spend" aria-pressed="${campSort === "spend"}">Spend${campSort === "spend" ? " ↓" : ""}</button></th><th><button class="th-sort" data-act="camp-sort" data-key="roas" aria-pressed="${campSort === "roas"}">ROAS IAA D0${campSort === "roas" ? " ↓" : ""}</button></th><th>Target ROAS</th></tr></thead><tbody>${
    rows.map(c => { const r = c.spend > 0 ? c.rev / c.spend : null, t = c.roasBid || kpiOf(c.code);
      return `<tr><td>${esc(c.name)}${c.isNew ? ' <span class="pill new">Mới</span>' : ""}<div class="share">${esc(c.id)}${c.createdDay ? ` · tạo ${shortDate(c.createdDay)}` : ""}</div></td><td>${c.code ? esc(appName(c.code)) : '<span class="share">ngoài bộ lọc</span>'}</td><td>${status(c.status)}</td><td>${c.budget ? fmtUsd(c.budget) : "—"}</td><td>${maxCell(c)}</td><td>${fmtUsd(c.spend)}</td><td class="num ${r == null ? "na" : roasCls(r, t)}">${r == null ? "—" : r.toFixed(3)}</td><td>${c.roasBid ? c.roasBid.toFixed(2) : '<span class="share">—</span>'}</td></tr>`; }).join("")
  }</tbody><tfoot><tr><td>${rows.length} camp</td><td></td><td></td><td></td><td>${maxed} max</td><td>${fmtUsd(sp)}</td><td>${sp > 0 ? (rv / sp).toFixed(3) : "—"}</td><td></td></tr></tfoot></table>`;
}
function openCamps(acc, code, onlyMaxed = false, onlyNew = false) {
  campView = { acc, code };
  document.getElementById("campOnlyMaxed").checked = onlyMaxed;
  document.getElementById("campOnlyNew").checked = onlyNew;
  if (onlyNew) document.getElementById("campHideZero").checked = false;
  if (onlyMaxed || onlyNew) document.getElementById("campOnlyApp").checked = true;
  const info = accInfo.get(acc); const { cur } = rangeWindows(acc);
  document.getElementById("campTitle").textContent = info?.name || `Tài khoản ${acc}`;
  document.getElementById("campMeta").textContent = `${acc} · ${spanText(cur.start, cur.end)}${info?.tz ? " · " + tzOffset(info.tz) : ""}`;
  document.getElementById("campOnlyAppLabel").textContent = `Chỉ app ${appName(code)}`;
  document.getElementById("campSearch").value = "";
  renderCamps();
  campDlg.showModal();
}
["campOnlyApp", "campHideZero", "campOnlyMaxed", "campOnlyNew"].forEach(id => document.getElementById(id).addEventListener("change", renderCamps));
document.getElementById("campSearch").addEventListener("input", renderCamps);

/* ---------- Xuất CSV ---------- */
function csv(rows) { return rows.map(r => r.map(v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }).join(",")).join("\n"); }
async function saveFile(filename, text) {
  const downloads = await (window.claude?.use ? window.claude.use("downloads") : null);
  if (downloads) {
    try { await downloads.save({ filename, data: "﻿" + text }); }
    catch (e) { if (e?.code !== "declined") toast("Không xuất được file lúc này."); }
    return;
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + text], { type: "text/csv" }));
  a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function exportGeo(acc, code) {
  const { cur } = rangeWindows(acc);
  const g = geoCache.get(`${acc}|${code}|${cur.start}|${cur.end}`);
  if (g?.status !== "ok") return;
  const name = appName(code);
  saveFile(`top-geo_${name}_${acc}_${cur.start}_${cur.end}.csv`.replace(/[^\w.\-]+/g, "_"),
    csv([["country_code", "country", "spend", "roas_iaa_d0"], ...g.rows.map(r => [r.cc, countryName(r.cc), r.spend.toFixed(2), (r.rev / r.spend).toFixed(3)])]));
}
function exportCamps() {
  if (!campView) return;
  const { cur } = rangeWindows(campView.acc);
  saveFile(`campaigns_${campView.acc}_${cur.start}_${cur.end}.csv`,
    csv([["campaign_id", "campaign_name", "app", "status", "daily_budget", "max_budget_days", "spend", "roas_iaa_d0", "target_roas"],
      ...campRows().map(c => [c.id, c.name, c.code || "", c.status || "", c.budget || "", c.maxDays || 0, c.spend.toFixed(2), c.spend > 0 ? (c.rev / c.spend).toFixed(3) : "", c.roasBid || ""])]));
}

/* ---------- Dialogs ---------- */
const groupDlg = document.getElementById("groupDlg");
const appDlg = document.getElementById("appDlg");
let editing = null;

function openGroup(gi) {
  editing = { gi };
  const f = groupDlg.querySelector("form");
  const g = gi != null ? config.groups[gi] : { name: "", keyword: "Ecomdy", accounts: [] };
  f.name.value = g.name; f.keyword.value = g.keyword || "Ecomdy"; f.accounts.value = (g.accounts || []).join("\n");
  f.groupBy.value = g.groupBy === "account" ? "account" : "app";
  f.querySelector('[value="delete"]').hidden = gi == null;
  groupDlg.showModal();
}
groupDlg.addEventListener("close", () => {
  const f = groupDlg.querySelector("form"), { gi } = editing;
  if (groupDlg.returnValue === "save") {
    const accounts = [...new Set(f.accounts.value.split(/[\s,;]+/).map(s => s.replace(/\D/g, "")).filter(Boolean))];
    const g = { name: f.name.value.trim(), keyword: f.keyword.value.trim() || "Ecomdy", accounts, groupBy: f.groupBy.value === "account" ? "account" : "app" };
    if (gi == null) { config.groups.push(g); setTab(config.groups.length - 1); } else config.groups[gi] = g;
    results = []; saveConfig(); loadAll();
  } else if (groupDlg.returnValue === "delete") {
    ask(`Xóa nhóm "${config.groups[gi].name}"? Số liệu trên TikTok không bị ảnh hưởng.`).then(ok => {
      if (ok) { config.groups.splice(gi, 1); results = []; setTab(0); saveConfig(); loadAll(); }
    });
  }
});

function openApp(code, acc) {
  editing = { code, acc };
  const f = appDlg.querySelector("form"), ov = config.apps[code] || {};
  document.getElementById("appDlgTitle").textContent = ov.name ? `Sửa ${ov.name}` : "Đặt tên app";
  f.name.value = ov.name || ""; f.kpi.value = kpiOf(code).toFixed(2); f.pic.value = ov.pic || ""; f.appcode.value = ov.appCode || "";
  appDlg.showModal();
}
appDlg.addEventListener("close", () => {
  if (appDlg.returnValue === "delete") {
    const { code, acc } = editing, name = appName(code);
    ask(`Xóa "${name}" (tài khoản ${acc}) khỏi dashboard? Camp trên TikTok không bị ảnh hưởng; bấm "Hiện lại" ở đầu nhóm để lấy lại.`, "Xóa").then(ok => {
      if (!ok) return;
      config.hidden = [...new Set([...(config.hidden || []), hideKey(activeTab, acc, code)])];
      saveConfig(); render(); toast(`Đã xóa ${name} khỏi dashboard.`);
    });
    return;
  }
  if (appDlg.returnValue !== "save") return;
  const f = appDlg.querySelector("form");
  const kpi = parseFloat(f.kpi.value);
  config.apps[editing.code] = { ...config.apps[editing.code], name: f.name.value.trim(), kpi: isFinite(kpi) && kpi > 0 ? kpi : 1, pic: f.pic.value.trim(), appCode: f.appcode.value.trim() };
  saveConfig(); rebuild(activeTab); render();
});

function ask(message, okLabel = "Xóa") {
  const dlg = document.getElementById("confirmDlg");
  dlg.querySelector("p").textContent = message;
  dlg.querySelector('[value="ok"]').textContent = okLabel;
  dlg.returnValue = "";
  dlg.showModal();
  return new Promise(res => dlg.addEventListener("close", () => res(dlg.returnValue === "ok"), { once: true }));
}
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 4000);
}
function showBanner(msg) { const b = document.getElementById("banner"); b.textContent = msg; b.hidden = false; }
function hideBanner() { document.getElementById("banner").hidden = true; }

/* ---------- Events ---------- */
document.getElementById("presetSeg").addEventListener("click", e => {
  const b = e.target.closest("button[data-preset]"); if (!b) return;
  range = presetRange(b.dataset.preset); rangeTouched = true;
  openPanels.clear(); results = [];
  loadAll();
});
["dStart", "dEnd"].forEach(id => document.getElementById(id).addEventListener("change", () => {
  let s = document.getElementById("dStart").value, e = document.getElementById("dEnd").value;
  if (!s || !e) return;
  if (s > e) { if (id === "dStart") e = s; else s = e; }
  if (dayDiff(s, e) > 364) { toast("Chọn tối đa 365 ngày."); renderRangeUi(); return; }
  range = { start: s, end: e }; rangeTouched = true;   // chọn tay → bỏ chọn nhanh
  openPanels.clear(); results = [];
  loadAll();
}));

document.addEventListener("change", e => {
  const inp = e.target.closest(".kpi-input"); if (!inp || readOnly) return;
  const v = parseFloat(inp.value);
  if (!isFinite(v) || v <= 0) { toast("KPI phải là số lớn hơn 0."); render(); return; }
  const code = inp.dataset.code;
  config.apps[code] = { ...config.apps[code], kpi: Math.round(v * 1000) / 1000 };
  saveConfig(); render();
});
document.addEventListener("change", e => {
  const inp = e.target.closest(".f-code"); if (!inp || readOnly) return;
  const code = inp.dataset.code, v = inp.value.trim();
  config.apps[code] = { ...config.apps[code], appCode: v };
  saveConfig(); rebuild(activeTab); render();
  toast(v ? `Lọc camp chứa mã "${v}"` : "Đã trả về tự gom theo mã app");
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.closest(".f-code")) e.target.blur(); });

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  switch (el.dataset.act) {
    case "panel": {
      const id = el.dataset.id, kind = el.dataset.kind;
      if (openPanels.get(id) === kind) openPanels.delete(id); else openPanels.set(id, kind);
      render();
      if (openPanels.get(id) === "geo") {
        const a = (results[activeTab]?.apps || []).find(x => `${x.acc}-${x.code}` === id);
        if (a) loadGeo(a);
      }
      break;
    }
    case "tab": {
      const i = +el.dataset.g; if (i === activeTab) break;
      setTab(i); openPanels.clear();
      const key = `${rangeWindows().cur.start}|${rangeWindows().cur.end}`;
      if (results[i]?.status === "ok" && results[i].rangeKey === key) render(); else loadAll();
      break;
    }
    case "sort":
      appSort = el.dataset.key; try { localStorage.setItem(SORT_KEY, appSort); } catch (e) {}
      render(); break;
    case "camp-sort": campSort = el.dataset.key; renderCamps(); break;
    case "camps": openCamps(el.dataset.acc, el.dataset.code, el.dataset.maxed === "1", el.dataset.new === "1"); break;
    case "geo-csv": exportGeo(el.dataset.acc, el.dataset.code); break;
    case "camp-csv": exportCamps(); break;
    case "add-group": openGroup(null); break;
    case "edit-group": openGroup(+el.dataset.g); break;
    case "edit-app": openApp(el.dataset.code, el.dataset.acc); break;
    case "unhide":
      config.hidden = (config.hidden || []).filter(k => !k.startsWith(`${el.dataset.g}#`));
      saveConfig(); render(); toast("Đã hiện lại các app đã xóa."); break;
    case "refresh": loadAll(true); break;
    case "save": document.activeElement?.blur?.(); saveConfig(true); break;
  }
});

/* ---------- Khởi động ---------- */
async function boot() {
  config = loadLocal();
  ensureDefaultRange(); renderRangeUi(); render(); showSaveState();
  const use = n => (window.claude?.use ? window.claude.use(n) : Promise.resolve(null));
  const [db, m] = await Promise.all([use("db"), use("mcp")]);
  mcp = m; mcpReady = true;
  if (db) {
    dbRef = db.doc(CONFIG_DOC); showSaveState();
    let first = true;
    dbRef.onSnapshot(snap => {
      if (snap.metadata.hasPendingWrites) return;
      const next = normalize(snap.exists ? structuredClone(snap.data()) : {});
      const accountsChanged = JSON.stringify(next.groups) !== JSON.stringify(config.groups);
      config = next;
      if (first || accountsChanged) { first = false; results = []; loadAll(); } else { rebuild(activeTab); render(); }
    }, () => toast("Mất kết nối dữ liệu. Tải lại trang để tiếp tục."));
    use("user").then(u => u?.can?.("data.write")).then(can => { if (can === false) { readOnly = true; render(); } }).catch(() => {});
  } else {
    loadAll();
  }
}
boot();
</script>
