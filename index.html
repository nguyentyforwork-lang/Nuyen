<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KPI App Ecomdy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f5f8;
    --card: #ffffff;
    --border: #e6e7ec;
    --text: #15171c;
    --muted: #8a8f99;
    --chip-bg: #f1f2f5;
    --chip-border: #e2e4e9;
    --chip-text: #4a4f59;
    --camp-bg: #f1f1fb;
    --camp-text: #4338ca;
    --good: #9a5b1e;      /* >= 90% KPI */
    --bad: #a32d2d;       /* < 90% KPI */
    --up: #2e7d32;
    --down: #b3261e;
    --line: #4f46e5;
    --track: #eef0f3;
    --shadow: 0 1px 2px rgba(16, 24, 40, .04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115; --card: #181b21; --border: #262a33; --text: #eceef2; --muted: #8c93a0;
      --chip-bg: #22262e; --chip-border: #2e333d; --chip-text: #c3c8d1;
      --camp-bg: #23233d; --camp-text: #a5a3ff;
      --good: #d4914a; --bad: #e0675f; --up: #5fbf68; --down: #ef6b62;
      --line: #8b85ff; --track: #262a33;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1115; --card: #181b21; --border: #262a33; --text: #eceef2; --muted: #8c93a0;
    --chip-bg: #22262e; --chip-border: #2e333d; --chip-text: #c3c8d1;
    --camp-bg: #23233d; --camp-text: #a5a3ff;
    --good: #d4914a; --bad: #e0675f; --up: #5fbf68; --down: #ef6b62;
    --line: #8b85ff; --track: #262a33;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-feature-settings: "tnum";
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1680px; margin: 0 auto; padding: 16px; }

  .group-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin: 4px 0 20px; }
  .group-head h1 { font-size: 28px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
  .group-head .sub { color: var(--muted); font-size: 20px; }

  .grid {
    align-items: start;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr));
    gap: 24px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 24px 24px 20px;
    box-shadow: var(--shadow);
    display: flex; flex-direction: column;
  }
  .top { display: flex; justify-content: space-between; gap: 12px; }
  .name { font-size: 24px; font-weight: 600; margin: 4px 0 12px; }
  .score { text-align: right; flex-shrink: 0; }
  .score .val { font-size: 44px; font-weight: 700; line-height: 1; letter-spacing: -.02em; }
  .score .pct { color: var(--muted); font-size: 18px; margin-top: 8px; }

  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip {
    font-size: 17px; font-weight: 500;
    padding: 5px 11px; border-radius: 7px;
    background: var(--chip-bg); border: 1px solid var(--chip-border); color: var(--chip-text);
  }
  .chip.camp { background: var(--camp-bg); color: var(--camp-text); border-color: transparent; }

  .bar { height: 8px; border-radius: 99px; background: var(--track); margin: 22px 0 16px; overflow: hidden; }
  .bar > span { display: block; height: 100%; border-radius: 99px; }

  .spark { width: 100%; height: 64px; display: block; overflow: visible; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 24px; }
  .stat .lbl { font-size: 16px; font-weight: 500; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
  .stat .num { font-size: 23px; font-weight: 600; margin-top: 8px; letter-spacing: .01em; }
  .num.up { color: var(--up); } .num.down { color: var(--down); }

  .foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 18px; }
  .acc { color: var(--muted); font-size: 18px; letter-spacing: .03em; overflow: hidden; text-overflow: ellipsis; }
  .btn {
    font: inherit; font-size: 19px; color: var(--text);
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 8px 15px; cursor: pointer; flex-shrink: 0;
  }
  .btn:hover { background: var(--chip-bg); }
  .btn[aria-expanded="true"] { background: var(--chip-bg); }

  .daily { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 10px; display: none; }
  .daily.open { display: block; }
  .daily table { width: 100%; border-collapse: collapse; font-size: 15px; }
  .daily th { text-align: right; color: var(--muted); font-weight: 500; padding: 4px 6px; }
  .daily td { text-align: right; padding: 4px 6px; border-top: 1px solid var(--border); }
  .daily th:first-child, .daily td:first-child { text-align: left; }

  @media (max-width: 520px) {
    .card { padding: 18px 16px 16px; }
    .name { font-size: 20px; }
    .score .val { font-size: 36px; }
    .stat .lbl { font-size: 13px; }
    .stat .num { font-size: 19px; }
    .acc { font-size: 14px; }
    .btn { font-size: 16px; }
  }

  /* ---------- Toolbar & editor ---------- */
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-bottom: 16px; }
  .tb {
    font: inherit; font-size: 14px; font-weight: 500; color: var(--text);
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 7px 12px; cursor: pointer;
  }
  .tb:hover { background: var(--chip-bg); }
  .tb.primary { background: var(--line); border-color: var(--line); color: #fff; }
  .tb.danger { color: var(--down); }
  section + section { margin-top: 36px; }
  .group-head .actions { margin-left: auto; display: flex; gap: 6px; }
  .icon {
    font: inherit; font-size: 13px; color: var(--muted); background: transparent;
    border: 1px solid transparent; border-radius: 8px; padding: 4px 8px; cursor: pointer;
  }
  .icon:hover { color: var(--text); border-color: var(--border); background: var(--card); }
  .name-row { display: flex; align-items: center; gap: 6px; }
  .name-row .icon { margin-top: -8px; }
  .empty {
    border: 1.5px dashed var(--border); border-radius: 18px; min-height: 160px;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 16px; cursor: pointer; background: transparent; font-family: inherit;
  }
  .empty:hover { color: var(--text); border-color: var(--muted); }
  .num.na { color: var(--muted); }

  dialog {
    border: 1px solid var(--border); border-radius: 16px; padding: 0;
    background: var(--card); color: var(--text); width: min(560px, calc(100vw - 32px));
  }
  dialog::backdrop { background: rgba(10, 12, 16, .45); }
  dialog form { padding: 20px; }
  dialog h2 { margin: 0 0 16px; font-size: 19px; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .fields .full { grid-column: 1 / -1; }
  .fields label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--muted); font-weight: 500; }
  .fields input, .fields textarea {
    font: inherit; font-size: 15px; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; width: 100%;
  }
  .fields textarea { min-height: 84px; resize: vertical; font-variant-numeric: tabular-nums; }
  .fields .hint { font-weight: 400; font-size: 12px; }
  .dlg-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
  .dlg-actions .spacer { flex: 1; }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    background: var(--text); color: var(--card); padding: 10px 16px; border-radius: 10px;
    font-size: 14px; max-width: calc(100vw - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.18);
  }
  .sync { font-size: 13px; color: var(--muted); align-self: center; margin-right: auto; }
  body:not(.synced) .sync.db, body.synced .sync.local { display: none; }
  body.readonly [data-act="add-group"], body.readonly [data-act="add-app"], body.readonly [data-act="edit-group"],
  body.readonly [data-act="edit-app"], body.readonly [data-act="import"], body.readonly [data-act="clear"] { display: none; }
  .tb:focus-visible, .btn:focus-visible, .icon:focus-visible, .empty:focus-visible { outline: 2px solid var(--line); outline-offset: 2px; }
  @media (max-width: 520px) { .fields { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="toolbar">
    <span class="sync db">Đã đồng bộ: lưu trên server, mở máy nào cũng thấy</span>
    <span class="sync local">Lưu trong trình duyệt này. Dùng Xuất JSON để sao lưu</span>
    <button class="tb primary" data-act="add-group">+ Thêm nhóm</button>
    <button class="tb" data-act="export">Xuất JSON</button>
    <button class="tb" data-act="import">Nhập JSON</button>
    <button class="tb danger" data-act="clear">Xóa hết</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
  <div id="app"></div>
</div>

<dialog id="groupDlg">
  <form method="dialog">
    <h2>Nhóm</h2>
    <div class="fields">
      <label class="full">Tên nhóm<input name="name" required placeholder="Apero"></label>
      <label class="full">Ghi chú<input name="note" placeholder="chỉ camp Ecomdy"></label>
    </div>
    <div class="dlg-actions">
      <button class="tb danger" value="delete" formnovalidate>Xóa nhóm</button>
      <span class="spacer"></span>
      <button class="tb" value="cancel" formnovalidate>Hủy</button>
      <button class="tb primary" value="save">Lưu</button>
    </div>
  </form>
</dialog>

<dialog id="appDlg">
  <form method="dialog">
    <h2>App</h2>
    <div class="fields">
      <label class="full">Tên app<input name="name" required placeholder="AI Chat"></label>
      <label>OS<input name="os" placeholder="iOS / Android (trống = OS?)"></label>
      <label>KPI ROAS<input name="kpi" type="number" step="any" min="0" value="1"></label>
      <label class="full">Campaign<input name="campaign" placeholder="APB508_Global_ROAS_Ecomdy"></label>
      <label class="full">ID tài khoản<input name="account" placeholder="7542372674190934023"></label>
      <label>Spend<input name="spend" type="number" step="any" min="0" placeholder="728"></label>
      <label>Spend kỳ trước <span class="hint">(để tính Δ)</span><input name="prevSpend" type="number" step="any" min="0"></label>
      <label class="full">NS/ngày <span class="hint">(trống = hiện SPEND/NGÀY)</span><input name="budget" type="number" step="any" min="0"></label>
      <label class="full">Số liệu theo ngày <span class="hint">— mỗi dòng 1 ngày, cũ → mới: <code>ROAS</code> hoặc <code>ROAS, spend</code> hoặc <code>ngày, ROAS, spend</code>. Dòng cuối = ROAS hiện tại.</span>
        <textarea name="daily" placeholder="1.02, 110&#10;0.98, 95&#10;0.906, 102"></textarea></label>
    </div>
    <div class="dlg-actions">
      <button class="tb danger" value="delete" formnovalidate>Xóa app</button>
      <span class="spacer"></span>
      <button class="tb" value="cancel" formnovalidate>Hủy</button>
      <button class="tb primary" value="save">Lưu</button>
    </div>
  </form>
</dialog>

<dialog id="confirmDlg">
  <form method="dialog">
    <p style="margin:0 0 4px;font-size:16px;line-height:1.5"></p>
    <div class="dlg-actions">
      <button class="tb" value="cancel">Hủy</button>
      <button class="tb danger" value="ok">Xóa</button>
    </div>
  </form>
</dialog>
<div id="toast" class="toast" role="status" hidden></div>

<script>
/* ---------- Mô hình dữ liệu ----------
   group: { name, note, apps: [app] }
   app:   { name, os, kpi, campaign, account, spend, prevSpend, budget,
            daily: [{ date?, roas, spend? }] }   // cũ -> mới, phần tử cuối = hiện tại

   Lưu trữ:
   - Mở trên Claude: database của trang (lưu trên server, máy nào cũng thấy).
   - Mở ở nơi khác (GitHub Pages, file trên máy): localStorage của trình duyệt.
   Dùng Xuất/Nhập JSON để sao lưu hoặc chuyển dữ liệu.
*/
const STORE_KEY = "apero-dashboard-v1";
const DB_DOC = "dashboard/main";
const GOOD_RATIO = 0.9; // >= 90% KPI -> màu nâu, dưới -> đỏ

let groups = loadLocal();
let dbRef = null;        // khi có database
let readOnly = false;
let writing = Promise.resolve();

function loadLocal() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return [];
}

function save() {
  render();
  const snapshot = structuredClone(groups);
  if (!dbRef) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(snapshot)); }
    catch (e) { toast("Trình duyệt không cho lưu dữ liệu. Hãy Xuất JSON để giữ lại."); }
    return;
  }
  // Mỗi lần chỉ một lệnh ghi vào tài liệu.
  writing = writing.then(() => dbRef.set({ groups: snapshot, updatedAt: new Date().toISOString() }))
    .catch(err => {
      if (err?.code === "invalid_argument") { readOnly = true; render(); toast("Bạn chỉ có quyền xem, thay đổi không được lưu."); }
      else if (err?.code === "quota_exceeded") toast("Dữ liệu quá lớn để lưu. Hãy bớt số ngày hoặc xóa app cũ.");
      else toast("Chưa lưu được thay đổi. Kiểm tra kết nối rồi thử lại.");
    });
}

async function connectDb() {
  const db = await window.claude?.use?.("db");
  if (!db) return; // không có database: dùng localStorage
  dbRef = db.doc(DB_DOC);
  groups = [];
  document.body.classList.add("synced");
  render();
  dbRef.onSnapshot(snap => {
    if (snap.metadata.hasPendingWrites) return;
    groups = snap.exists ? structuredClone(snap.data().groups || []) : [];
    render();
  }, () => { toast("Mất kết nối dữ liệu. Tải lại trang để tiếp tục."); });
  try {
    const user = await window.claude.use("user");
    const can = await user?.can?.("data.write");
    if (can === false) { readOnly = true; render(); }
  } catch (e) {}
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 4000);
}

/* Hộp xác nhận trong trang (confirm() bị chặn trong trang Claude) */
function ask(message, okLabel = "Xóa") {
  const dlg = document.getElementById("confirmDlg");
  dlg.querySelector("p").textContent = message;
  dlg.querySelector('[value="ok"]').textContent = okLabel;
  dlg.returnValue = "";
  dlg.showModal();
  return new Promise(res => dlg.addEventListener("close", () => res(dlg.returnValue === "ok"), { once: true }));
}

/* ---------- Helpers ---------- */
const isNum = v => typeof v === "number" && isFinite(v);
const fmtUsd = v => !isNum(v) ? "—" : "$" + (v >= 1000 || Number.isInteger(v)
  ? Math.round(v).toLocaleString("en-US")
  : v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const toNum = s => { const v = parseFloat(String(s).replace(/[$,\s]/g, "")); return isFinite(v) ? v : null; };

function sparkline(series, kpi) {
  if (series.length < 2) return `<svg class="spark" viewBox="0 0 480 64" aria-hidden="true"></svg>`;
  const W = 480, H = 64, pad = 6;
  const lo = Math.min(...series, kpi), hi = Math.max(...series, kpi);
  const span = hi - lo || 1;
  const x = i => (i / (series.length - 1)) * W;
  const y = v => pad + (1 - (v - lo) / span) * (H - pad * 2);
  const pts = series.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const ky = y(kpi).toFixed(1);
  const dots = series.slice(-2).map((v, j) => {
    const i = series.length - 2 + j;
    return `<circle cx="${x(i)}" cy="${y(v)}" r="5" fill="${v >= kpi ? "var(--up)" : "var(--down)"}"/>`;
  }).join("");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <line x1="0" x2="${W}" y1="${ky}" y2="${ky}" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="8 6" vector-effect="non-scaling-stroke" opacity=".7"/>
    <polyline points="${pts}" fill="none" stroke="var(--line)" stroke-width="2.2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    ${dots}
  </svg>`;
}

function dailyTable(app) {
  const d = app.daily || [];
  if (!d.length) return `<div class="acc">Chưa có số liệu theo ngày.</div>`;
  const hasSpend = d.some(r => isNum(r.spend));
  const rows = d.map((r, i) => {
    const label = r.date || `Ngày ${i + 1}`;
    return `<tr><td>${esc(label)}</td>${hasSpend ? `<td>${fmtUsd(r.spend)}</td>` : ""}<td class="num ${r.roas >= app.kpi ? "up" : "down"}">${r.roas.toFixed(3)}</td></tr>`;
  }).reverse().join("");
  return `<table><thead><tr><th>Ngày</th>${hasSpend ? "<th>Spend</th>" : ""}<th>ROAS</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function card(app, gi, ai) {
  const kpi = isNum(app.kpi) && app.kpi > 0 ? app.kpi : 1;
  const series = (app.daily || []).map(r => r.roas);
  const score = series.length ? series[series.length - 1] : null;
  const ratio = isNum(score) ? score / kpi : 0;
  const color = ratio >= GOOD_RATIO ? "var(--good)" : "var(--bad)";
  const hasDelta = isNum(app.spend) && isNum(app.prevSpend) && app.prevSpend > 0;
  const delta = hasDelta ? (app.spend - app.prevSpend) / app.prevSpend : 0;
  const deltaHtml = hasDelta
    ? `<div class="num ${delta >= 0 ? "up" : "down"}">${(delta >= 0 ? "+" : "-") + Math.abs(Math.round(delta * 100))}%</div>`
    : `<div class="num na">—</div>`;
  const third = isNum(app.budget)
    ? { lbl: "NS/ngày", val: fmtUsd(app.budget) }
    : { lbl: "Spend/ngày", val: fmtUsd(app.spend) };
  const id = `d${gi}-${ai}`;

  return `<article class="card">
    <div class="top">
      <div>
        <div class="name-row"><div class="name">${esc(app.name)}</div><button class="icon" data-act="edit-app" data-g="${gi}" data-a="${ai}">Sửa</button></div>
        <div class="chips">
          <span class="chip">${app.os ? esc(app.os) : "OS?"}</span>
          <span class="chip">KPI ${kpi.toFixed(2)}</span>
          ${app.campaign ? `<span class="chip camp">${esc(app.campaign)}</span>` : ""}
        </div>
      </div>
      <div class="score">
        <div class="val" style="color:${isNum(score) ? color : "var(--muted)"}">${isNum(score) ? score.toFixed(3) : "—"}</div>
        <div class="pct">${isNum(score) ? Math.round(ratio * 100) + "% KPI" : "chưa có ROAS"}</div>
      </div>
    </div>

    <div class="bar"><span style="width:${Math.min(ratio, 1) * 100}%;background:${color}"></span></div>
    ${sparkline(series, kpi)}

    <div class="stats">
      <div class="stat"><div class="lbl">Spend</div><div class="num">${fmtUsd(app.spend)}</div></div>
      <div class="stat"><div class="lbl">Δ Spend</div>${deltaHtml}</div>
      <div class="stat"><div class="lbl">${third.lbl}</div><div class="num">${third.val}</div></div>
    </div>

    <div class="foot">
      <span class="acc">${esc(app.account)}</span>
      <button class="btn" data-act="toggle" aria-expanded="false" aria-controls="${id}">Theo ngày</button>
    </div>
    <div class="daily" id="${id}">${dailyTable(app)}</div>
  </article>`;
}

function render() {
  const el = document.getElementById("app");
  document.body.classList.toggle("readonly", readOnly);
  if (!groups.length) {
    el.innerHTML = readOnly
      ? `<div class="empty" style="width:100%">Chưa có dữ liệu.</div>`
      : `<button class="empty" style="width:100%" data-act="add-group">Chưa có dữ liệu. Bấm để thêm nhóm đầu tiên (vd. Apero), rồi thêm app vào nhóm.</button>`;
    return;
  }
  el.innerHTML = groups.map((g, gi) => {
    const total = g.apps.reduce((s, a) => s + (isNum(a.spend) ? a.spend : 0), 0);
    return `<section>
      <div class="group-head">
        <h1>${esc(g.name)}</h1>
        <span class="sub">${g.apps.length} app · ${fmtUsd(Math.round(total))}${g.note ? " · " + esc(g.note) : ""}</span>
        <span class="actions">
          <button class="icon" data-act="edit-group" data-g="${gi}">Sửa nhóm</button>
          <button class="icon" data-act="add-app" data-g="${gi}">+ App</button>
        </span>
      </div>
      <div class="grid">
        ${g.apps.map((a, ai) => card(a, gi, ai)).join("")}
        <button class="empty" data-act="add-app" data-g="${gi}">+ Thêm app</button>
      </div>
    </section>`;
  }).join("");
}

/* ---------- Editor ---------- */
const groupDlg = document.getElementById("groupDlg");
const appDlg = document.getElementById("appDlg");
let editing = null; // { gi, ai }

function openGroup(gi) {
  editing = { gi };
  const f = groupDlg.querySelector("form");
  const g = gi != null ? groups[gi] : { name: "", note: "" };
  f.name.value = g.name; f.note.value = g.note || "";
  f.querySelector('[value="delete"]').hidden = gi == null;
  groupDlg.showModal();
}

function dailyToText(daily) {
  return (daily || []).map(r => [r.date, r.roas, r.spend].filter(v => v != null && v !== "").join(", ")).join("\n");
}
function parseDaily(text) {
  return text.split(/\n/).map(l => l.trim()).filter(Boolean).map(line => {
    const parts = line.split(/[,;\t]+/).map(s => s.trim()).filter(Boolean);
    let date = null;
    if (parts.length >= 3 || (parts.length === 2 && toNum(parts[0]) === null)) date = parts.shift();
    const roas = toNum(parts[0]);
    const spend = parts.length > 1 ? toNum(parts[1]) : null;
    if (roas === null) return null;
    const r = { roas };
    if (date) r.date = date;
    if (spend !== null) r.spend = spend;
    return r;
  }).filter(Boolean);
}

function openApp(gi, ai) {
  editing = { gi, ai };
  const f = appDlg.querySelector("form");
  const a = ai != null ? groups[gi].apps[ai] : { kpi: 1 };
  for (const k of ["name", "os", "campaign", "account"]) f[k].value = a[k] ?? "";
  for (const k of ["kpi", "spend", "prevSpend", "budget"]) f[k].value = isNum(a[k]) ? a[k] : "";
  f.daily.value = dailyToText(a.daily);
  f.querySelector('[value="delete"]').hidden = ai == null;
  appDlg.showModal();
}

groupDlg.addEventListener("close", () => {
  const f = groupDlg.querySelector("form"), { gi } = editing;
  if (groupDlg.returnValue === "save") {
    const data = { name: f.name.value.trim(), note: f.note.value.trim() };
    if (gi == null) groups.push({ ...data, apps: [] });
    else Object.assign(groups[gi], data);
    save();
  } else if (groupDlg.returnValue === "delete") {
    ask(`Xóa nhóm "${groups[gi].name}" và toàn bộ app trong đó?`).then(ok => { if (ok) { groups.splice(gi, 1); save(); } });
  }
});

appDlg.addEventListener("close", () => {
  const f = appDlg.querySelector("form"), { gi, ai } = editing;
  if (appDlg.returnValue === "save") {
    const app = {
      name: f.name.value.trim(),
      os: f.os.value.trim() || null,
      kpi: toNum(f.kpi.value) ?? 1,
      campaign: f.campaign.value.trim(),
      account: f.account.value.trim(),
      spend: toNum(f.spend.value),
      prevSpend: toNum(f.prevSpend.value),
      budget: toNum(f.budget.value),
      daily: parseDaily(f.daily.value),
    };
    if (ai == null) groups[gi].apps.push(app); else groups[gi].apps[ai] = app;
    save();
  } else if (appDlg.returnValue === "delete") {
    ask(`Xóa app "${groups[gi].apps[ai].name}"?`).then(ok => { if (ok) { groups[gi].apps.splice(ai, 1); save(); } });
  }
});

/* ---------- Import / export ---------- */
async function exportJson() {
  const filename = `dashboard-${new Date().toISOString().slice(0, 10)}.json`;
  const json = JSON.stringify(groups, null, 2);
  const downloads = await window.claude?.use?.("downloads");
  if (downloads) {
    try { await downloads.save({ filename, data: json }); }
    catch (err) { if (err?.code !== "declined") toast("Không xuất được file lúc này."); }
    return;
  }
  const blob = new Blob([json], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
document.getElementById("importFile").addEventListener("change", async e => {
  const file = e.target.files[0]; e.target.value = "";
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data)) throw new Error("File phải là mảng các nhóm");
    if (groups.length && !(await ask("Nhập file sẽ thay toàn bộ dữ liệu hiện tại. Tiếp tục?", "Nhập"))) return;
    groups = data; save(); toast("Đã nhập dữ liệu.");
  } catch (err) { toast("Không đọc được file: " + err.message); }
});

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const gi = el.dataset.g != null ? +el.dataset.g : null;
  const ai = el.dataset.a != null ? +el.dataset.a : null;
  switch (el.dataset.act) {
    case "toggle": {
      const open = el.getAttribute("aria-expanded") !== "true";
      el.setAttribute("aria-expanded", open);
      document.getElementById(el.getAttribute("aria-controls")).classList.toggle("open", open);
      break;
    }
    case "add-group": openGroup(null); break;
    case "edit-group": openGroup(gi); break;
    case "add-app": openApp(gi, null); break;
    case "edit-app": openApp(gi, ai); break;
    case "export": exportJson(); break;
    case "import": document.getElementById("importFile").click(); break;
    case "clear":
      ask("Xóa toàn bộ dữ liệu? Nên Xuất JSON trước để sao lưu.", "Xóa hết").then(ok => { if (ok) { groups = []; save(); } });
      break;
  }
});

render();
connectDb();
</script>
</body>
</html>
