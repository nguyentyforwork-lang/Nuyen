<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Video Variant Studio</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36; --text: #e9ecf2; --muted: #8b93a7;
    --accent: #fe2c55; --accent2: #25f4ee; --ok: #3ccf8e; --err: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  h2 { font-size: 18px; margin: 32px 0 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  .drop { display: block; border: 2px dashed var(--line); border-radius: 12px; padding: 32px 16px; text-align: center; cursor: pointer; transition: .15s; }
  .drop.over, .drop:hover { border-color: var(--accent2); }
  .drop video { max-height: 260px; max-width: 100%; border-radius: 8px; margin-top: 12px; }
  textarea { width: 100%; margin-top: 14px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font: inherit; min-height: 64px; resize: vertical; }
  button, .btn { background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
  .btn.sm { padding: 6px 12px; font-size: 13px; }
  .row { display: flex; gap: 12px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
  .status { color: var(--muted); }
  .bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 12px; }
  .bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .4s; }
  .concept { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-top: 16px; }
  .concept div { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .concept b { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .grid.extras { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
  .media { aspect-ratio: 9 / 16; background: #000; display: grid; place-items: center; color: var(--muted); font-size: 13px; text-align: center; padding: 0; position: relative; }
  .media video { width: 100%; height: 100%; object-fit: contain; }
  .media .spin { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--accent2); border-radius: 50%; animation: s 1s linear infinite; margin: 0 auto 8px; }
  @keyframes s { to { transform: rotate(360deg); } }
  .meta { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .meta .name { font-weight: 600; }
  .meta .desc { color: var(--muted); font-size: 13px; }
  .meta .err { color: var(--err); font-size: 12px; word-break: break-word; }
  .meta .actions { margin-top: auto; display: flex; gap: 8px; }
  .tag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--accent2); color: #000; text-transform: uppercase; }
  .tag.hook { background: #ffcc4d; } .tag.hero { background: var(--accent2); } .tag.promise { background: var(--ok); }
  .pill { font-size: 12px; color: var(--muted); font-weight: 400; }
  .hidden { display: none !important; }
  .mockbadge { background: #ffcc4d; color: #000; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; margin-left: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Video Variant Studio <span id="mockBadge" class="mockbadge hidden">MOCK</span></h1>
  <p class="sub">Upload 1 video concept → nhận 10 video cùng concept với 10 nhân vật khác nhau, cộng thêm 3 video Hook / Hero / Promise riêng.</p>

  <div class="panel">
    <label class="drop" id="drop">
      <input type="file" id="file" accept="video/*" hidden />
      <div id="dropText"><b>Kéo thả video vào đây</b> hoặc bấm để chọn file<br><span class="status">MP4/MOV, tối đa 500MB. Nên dùng video ngắn (≤ 30s).</span></div>
      <video id="preview" class="hidden" controls muted playsinline></video>
    </label>
    <textarea id="notes" placeholder="(Tuỳ chọn) Ghi chú thêm về concept / sản phẩm / tệp khách hàng, ví dụ: 'Kem chống nắng cho dân văn phòng, nhắm nữ 22-35'"></textarea>
    <div class="row">
      <button id="go" disabled>Gen 13 video</button>
      <span class="status" id="stage"></span>
    </div>
    <div class="bar"><i id="progress"></i></div>
    <div id="concept" class="concept hidden"></div>
  </div>

  <section id="results" class="hidden">
    <h2>10 biến thể nhân vật <span class="pill" id="vCount"></span>
      <button class="btn ghost sm" id="dlVariants" disabled>⬇ Tải tất cả 10</button></h2>
    <div class="grid" id="variants"></div>

    <h2>Hook · Hero · Promise <span class="pill" id="xCount"></span>
      <button class="btn ghost sm" id="dlExtras" disabled>⬇ Tải cả 3</button></h2>
    <div class="grid extras" id="extras"></div>
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
let file = null, jobId = null, timer = null, lastJob = null;

fetch("/api/config").then(r => r.json()).then(c => { if (c.mock) $("mockBadge").classList.remove("hidden"); });

const drop = $("drop");
$("file").addEventListener("change", e => pick(e.target.files[0]));
["dragover", "dragenter"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => pick(e.dataTransfer.files[0]));

function pick(f) {
  if (!f || !f.type.startsWith("video/")) return;
  file = f;
  const v = $("preview");
  v.src = URL.createObjectURL(f);
  v.classList.remove("hidden");
  $("dropText").innerHTML = `<b>${esc(f.name)}</b> · ${(f.size / 1048576).toFixed(1)} MB — bấm để đổi video`;
  $("go").disabled = false;
}

$("go").addEventListener("click", async () => {
  if (!file) return;
  $("go").disabled = true;
  $("stage").textContent = "Đang upload…";
  const fd = new FormData();
  fd.append("video", file);
  fd.append("notes", $("notes").value);
  try {
    const r = await fetch("/api/jobs", { method: "POST", body: fd });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error);
    jobId = j.id;
    $("results").classList.remove("hidden");
    poll();
  } catch (e) {
    $("stage").textContent = "Lỗi: " + e.message;
    $("go").disabled = false;
  }
});

async function poll() {
  clearTimeout(timer);
  const r = await fetch(`/api/jobs/${jobId}`);
  const job = await r.json();
  lastJob = job;
  render(job);
  const busy = job.status === "queued" || job.status === "running" ||
    [...job.variants, ...job.extras].some(x => x.status === "running");
  if (busy) timer = setTimeout(poll, 2500);
  else $("go").disabled = false;
}

function render(job) {
  const all = [...job.variants, ...job.extras];
  const done = all.filter(x => x.status === "done").length;
  $("stage").textContent = job.status === "failed" ? "Lỗi: " + job.error : `${job.stage} · ${done}/13 video`;
  $("progress").style.width = (job.concept ? 10 + 90 * done / 13 : job.status === "running" ? 5 : 0) + "%";

  if (job.concept) {
    const c = job.concept;
    $("concept").classList.remove("hidden");
    $("concept").innerHTML = [["Concept", c.concept_summary], ["Nhân vật gốc", c.original_character], ["Bối cảnh", c.setting], ["Phong cách", c.visual_style]]
      .map(([k, v]) => `<div><b>${k}</b>${esc(v)}</div>`).join("");
  }
  const vd = job.variants.filter(x => x.status === "done").length;
  const xd = job.extras.filter(x => x.status === "done").length;
  $("vCount").textContent = `${vd}/10 xong`;
  $("xCount").textContent = `${xd}/3 xong`;
  $("dlVariants").disabled = !vd;
  $("dlExtras").disabled = !xd;
  renderList($("variants"), job.variants, v => ({ title: `#${v.index} · ${v.name || "Nhân vật " + v.index}`, desc: v.character_description }));
  renderList($("extras"), job.extras, x => ({ title: x.title || x.key, desc: x.description, tag: x.key }));
}

function renderList(el, items, label) {
  items.forEach(item => {
    let card = el.querySelector(`[data-key="${item.key}"]`);
    const sig = item.status + (item.step || "") + (item.name || item.title || "");
    if (card && card.dataset.sig === sig) return;
    const { title, desc, tag } = label(item);
    const html = `
      <div class="media">${item.status === "done"
        ? `<video src="${item.previewUrl}" controls playsinline preload="metadata"></video>`
        : item.status === "running" ? `<div><div class="spin"></div>${esc(item.step || "Đang xử lý")}</div>`
        : item.status === "failed" ? `<div>⚠ Lỗi</div>` : `<div>Đang chờ…</div>`}</div>
      <div class="meta">
        <div class="name">${tag ? `<span class="tag ${tag}">${tag}</span> ` : ""}${esc(title)}</div>
        ${desc ? `<div class="desc">${esc(desc)}</div>` : ""}
        ${item.error ? `<div class="err">${esc(item.error)}</div>` : ""}
        <div class="actions">
          ${item.status === "done" ? `<a class="btn sm" href="${item.downloadUrl}" download>⬇ Download</a>` : ""}
          ${item.status === "failed" ? `<button class="btn ghost sm" data-retry="${item.key}">↻ Thử lại</button>` : ""}
        </div>
      </div>`;
    if (!card) { card = document.createElement("div"); card.className = "card"; card.dataset.key = item.key; el.appendChild(card); }
    card.dataset.sig = sig;
    card.innerHTML = html;
  });
}

document.addEventListener("click", async e => {
  const key = e.target.dataset?.retry;
  if (!key) return;
  e.target.disabled = true;
  await fetch(`/api/jobs/${jobId}/retry/${key}`, { method: "POST" });
  poll();
});

$("dlVariants").addEventListener("click", () => downloadAll(lastJob.variants));
$("dlExtras").addEventListener("click", () => downloadAll(lastJob.extras));
async function downloadAll(items) {
  for (const it of items.filter(x => x.status === "done")) {
    const a = document.createElement("a");
    a.href = it.downloadUrl; a.download = it.downloadName;
    document.body.appendChild(a); a.click(); a.remove();
    await new Promise(r => setTimeout(r, 600));
  }
}

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
</script>
</body>
</html>
